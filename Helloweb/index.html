<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="温馨的晚安问候网页，显示实时时间和天气">
    <meta name="theme-color" content="#667eea">
    <title>晚安问候</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #888;
            --btn-bg: #667eea;
            --btn-hover: #764ba2;
            --card-shadow: rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --card-bg: rgba(30, 30, 50, 0.9);
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
            --btn-bg: #00d4ff;
            --btn-hover: #0099cc;
            --card-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            font-family: 'Arial', sans-serif;
            transition: background 0.3s ease;
        }

        main {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--card-shadow);
            animation: fadeIn 1s ease-out;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            color: var(--text-primary);
            font-size: 3rem;
            margin: 0;
            transition: color 0.3s ease, opacity 0.5s ease;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-top: 15px;
            transition: color 0.3s ease, opacity 0.5s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .time-container {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        .time-display {
            font-size: 1.5rem;
            color: var(--text-primary);
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .date-display {
            font-size: 1rem;
            color: var(--text-tertiary);
            margin-top: 5px;
            transition: color 0.3s ease;
        }

        .weather-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease-out 0.7s forwards;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        [data-theme="dark"] .weather-container {
            background: rgba(50, 50, 70, 0.8);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .location {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-toggle {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            transition: background 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .city-selector {
            padding: 6px 10px;
            border-radius: 15px;
            border: 1px solid var(--text-tertiary);
            background: transparent;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .city-selector:focus {
            outline: 2px solid var(--btn-bg);
            outline-offset: 2px;
        }

        .refresh-btn {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: var(--btn-hover);
        }

        .refresh-btn:focus,
        .refresh-btn:focus-visible {
            outline: 2px solid var(--btn-hover);
            outline-offset: 2px;
        }

        .weather-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .weather-icon {
            font-size: 3rem;
        }

        .temperature {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .weather-details {
            text-align: left;
        }

        .weather-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .humidity-wind {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .weather-header {
                flex-direction: column;
                gap: 10px;
            }
            .header-controls {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* 跳过链接 - 无障碍 */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--btn-bg);
            color: white;
            padding: 8px 16px;
            z-index: 100;
            text-decoration: none;
            border-radius: 0 0 5px 0;
        }

        .skip-link:focus {
            top: 0;
        }

        /* 减少动画 - 无障碍 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳转到主要内容</a>

    <main id="main-content" role="main">
        <article class="container" role="article" aria-labelledby="greeting-title">
            <header>
                <h1 id="greeting-title">晚安</h1>
                <p id="greeting" aria-live="polite">愿你有一个宁静美好的夜晚</p>
            </header>

            <section class="time-container" aria-label="当前时间">
                <div class="time-display" id="time-display" role="timer" aria-label="时间">--:--:--</div>
                <div class="date-display" id="date-display" aria-label="日期">----年--月--日</div>
            </section>

            <section class="weather-container" aria-label="天气信息">
                <div class="weather-header">
                    <div class="location" id="location" aria-label="城市">北京</div>
                    <div class="header-controls">
                        <label for="citySelector" class="visually-hidden">选择城市</label>
                        <select id="citySelector" class="city-selector" aria-label="城市选择">
                            <option value="">选择城市</option>
                        </select>
                        <button type="button" id="themeToggle" class="theme-toggle" aria-label="切换深色模式">🌙</button>
                        <button type="button" class="refresh-btn" onclick="getWeatherData()" aria-label="刷新天气">刷新天气</button>
                    </div>
                </div>
                <div class="weather-info">
                    <div class="weather-icon" id="weather-icon" aria-hidden="true">☁️</div>
                    <div class="temperature" id="temperature" aria-label="温度">22°C</div>
                    <div class="weather-details">
                        <div class="weather-desc" id="weather-desc">多云</div>
                        <div class="humidity-wind" id="humidity-wind">湿度: 55% | 风速: 2.1 m/s</div>
                    </div>
                </div>
            </section>
        </article>
    </main>

    <script src="config.js"></script>
    <script src="lunar.js"></script>
    <script src="darkmode.js"></script>
    <script src="time.js"></script>
    <script src="weather.js"></script>
    <script>
        // 农历新年或公历新年期间跳转到对应页面
        (function() {
            var now = new Date();
            var m = now.getMonth() + 1;
            var d = now.getDate();
            // 公历新年：12月31日 - 1月1日
            if ((m === 12 && d === 31) || (m === 1 && d === 1)) {
                window.location.href = 'gregorian.html';
                return;
            }
            // 农历新年：新年前7天 ~ 新年后15天
            if (LunarNewYear.isDuringNewYear()) {
                window.location.href = 'newyear.html';
                return;
            }
        })();

        // 临时测试入口 - 手动跳转
        window.openGregorianNewYear = function() {
            window.location.href = 'gregorian.html';
        };
        window.openLunarNewYear = function() {
            window.location.href = 'newyear.html';
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            DarkModeModule.init();
            TimeModule.start();
            initCitySelector();
            getWeatherData();
        });

        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>

    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</body>
</html>
