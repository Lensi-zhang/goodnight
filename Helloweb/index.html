<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚安问候</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }
        h1 {
            color: #333;
            font-size: 3rem;
            margin: 0;
            transition: all 0.5s ease;
        }
        p {
            color: #666;
            font-size: 1.2rem;
            margin-top: 15px;
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .time-container {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }
        .time-display {
            font-size: 1.5rem;
            color: #555;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .date-display {
            font-size: 1rem;
            color: #888;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        .weather-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease-out 0.7s forwards;
            transition: all 0.3s ease;
        }
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .location {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }
        .refresh-btn:hover { background: #764ba2; }
        .weather-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .weather-icon { font-size: 3rem; }
        .temperature {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
        }
        .weather-details { text-align: left; }
        .weather-desc {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 5px;
        }
        .humidity-wind {
            font-size: 0.9rem;
            color: #888;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; margin: 20px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>晚安</h1>
        <p id="greeting">愿你有一个宁静美好的夜晚</p>

        <div class="time-container">
            <div class="time-display" id="time-display">--:--:--</div>
            <div class="date-display" id="date-display">----年--月--日</div>
        </div>

        <div class="weather-container">
            <div class="weather-header">
                <div class="location" id="location">北京</div>
                <button class="refresh-btn" onclick="getWeatherData()">刷新天气</button>
            </div>
            <div class="weather-info">
                <div class="weather-icon" id="weather-icon">☁️</div>
                <div class="temperature" id="temperature">22°C</div>
                <div class="weather-details">
                    <div class="weather-desc" id="weather-desc">多云</div>
                    <div class="humidity-wind" id="humidity-wind">湿度: 55% | 风速: 2.1 m/s</div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="lunar.js"></script>
    <script>
        // 农历新年期间跳转到新年页面
        (function() {
            if (LunarNewYear.isDuringNewYear()) {
                window.location.href = 'newyear.html';
                return;
            }
        })();

        var amapApiKey = API_CONFIG.amapApiKey;
        var weatherIcons = {
            '晴': '☀️', '多云': '☁️', '阴': '☁️', '小雨': '🌦️', '中雨': '🌧️',
            '大雨': '⛈️', '暴雨': '⛈️', '雷阵雨': '⛈️', '小雪': '❄️', '中雪': '❄️',
            '大雪': '❄️', '雾': '🌫️', '霾': '🌫️', 'default': '☀️'
        };
        var currentWeatherData = null;
        var regionMap = {
            '华中地区': '武汉', '华北地区': '北京', '华东地区': '上海',
            '华南地区': '广州', '西北地区': '西安', '西南地区': '成都', '东北地区': '沈阳'
        };

        function getWeatherData() {
            document.getElementById('temperature').textContent = '加载中...';
            document.getElementById('weather-desc').textContent = '获取天气信息中...';
            document.getElementById('humidity-wind').textContent = '';
            getLocationByIP();
        }

        function getLocationByIP() {
            var url = 'https://restapi.amap.com/v3/ip?key=' + amapApiKey;
            var cb = 'cb_' + Date.now();
            window[cb] = function(data) {
                if (data.status === '1') {
                    var city = data.city || data.province;
                    if (regionMap[city]) city = regionMap[city];
                    getWeatherByCity(city);
                } else {
                    document.getElementById('temperature').textContent = '定位失败';
                    document.getElementById('weather-desc').textContent = data.info || '未知错误';
                }
                cleanup(cb);
            };
            createScript(url + '&output=jsonp&callback=' + cb, cb);
        }

        function createScript(url, cb) {
            var s = document.createElement('script');
            s.id = 'p-' + cb;
            s.src = url;
            s.onerror = function() {
                document.getElementById('temperature').textContent = '请求失败';
                document.getElementById('weather-desc').textContent = '无法连接到定位服务';
                cleanup(cb);
            };
            document.head.appendChild(s);
        }

        function cleanup(cb) {
            setTimeout(function() {
                var el = document.getElementById('p-' + cb);
                if (el && el.parentNode) el.parentNode.removeChild(el);
                delete window[cb];
            }, 0);
        }

        function getWeatherByCity(city) {
            var url = 'https://restapi.amap.com/v3/geocode/geo?address=' + encodeURIComponent(city) + '&key=' + amapApiKey;
            var cb = 'gc_' + Date.now();
            window[cb] = function(data) {
                if (data.status === '1' && data.geocodes && data.geocodes.length > 0) {
                    var loc = data.geocodes[0].location;
                    var parts = loc.split(',');
                    getAmapWeather(parseFloat(parts[1]), parseFloat(parts[0]), city);
                } else {
                    document.getElementById('temperature').textContent = '获取失败';
                    document.getElementById('weather-desc').textContent = '无法获取城市信息';
                }
                cleanup(cb);
            };
            createScript(url + '&output=jsonp&callback=' + cb, cb);
        }

        function getAmapWeather(lat, lon, city) {
            var url = 'https://restapi.amap.com/v3/geocode/regeo?location=' + lon + ',' + lat + '&key=' + amapApiKey;
            var cb = 'rg_' + Date.now();
            window[cb] = function(data) {
                if (data.status === '1' && data.regeocode && data.regeocode.addressComponent) {
                    var ad = data.regeocode.addressComponent.adcode;
                    if (ad) fetchWeather(ad, city);
                    else mockWeather(city);
                }
                cleanup(cb);
            };
            createScript(url + '&output=jsonp&callback=' + cb, cb);
        }

        function fetchWeather(adcode, city) {
            var url = 'https://restapi.amap.com/v3/weather/weatherInfo?city=' + adcode + '&key=' + amapApiKey;
            var cb = 'w_' + Date.now();
            window[cb] = function(data) {
                if (data.status === '1' && data.lives && data.lives.length > 0) {
                    var w = data.lives[0];
                    updateWeather({ city: city, temperature: w.temperature, description: w.weather, humidity: w.humidity, windSpeed: w.windpower, weatherType: w.weather });
                } else {
                    mockWeather(city);
                }
                cleanup(cb);
            };
            createScript(url + '&output=jsonp&callback=' + cb, cb);
        }

        function mockWeather(city) {
            updateWeather({ city: city || '未知位置', temperature: '--', description: '未知', humidity: '--', windSpeed: '--', weatherType: 'default' });
        }

        function updateWeather(d) {
            currentWeatherData = d;
            var c = document.querySelector('.weather-container');
            c.style.transform = 'translateY(5px)';
            c.style.opacity = '0.9';
            setTimeout(function() {
                document.getElementById('location').textContent = d.city;
                document.getElementById('temperature').textContent = d.temperature + '°C';
                document.getElementById('weather-icon').textContent = weatherIcons[d.weatherType] || weatherIcons.default;
                document.getElementById('weather-desc').textContent = d.description;
                document.getElementById('humidity-wind').textContent = '湿度: ' + d.humidity + '% | 风速: ' + d.windSpeed + ' 级';
                c.style.transform = 'translateY(0)';
                c.style.opacity = '1';
            }, 200);
            updateGreeting();
        }

        function updateGreeting() {
            if (!currentWeatherData) return;
            var city = currentWeatherData.city || '未知位置';
            var weather = currentWeatherData.description || '未知天气';
            var temp = currentWeatherData.temperature || '--';
            var h = new Date().getHours();
            var list = [
                city + '的' + h + '点，' + weather + temp + '°C，愿你心情如阳光般温暖！',
                weather + '的' + city + '，' + temp + '°C，' + h + '点的时光最适合享受生活！',
                '在' + city + weather + '的' + h + '点，' + temp + '°C的温度，祝你有个愉快的一天！',
                h + '点的' + city + '，' + weather + '宜人，' + temp + '°C正舒适，一切都会好起来的！',
                '今天' + city + weather + '，' + temp + '°C，' + h + '点的你，最美最棒！'
            ];
            var el = document.getElementById('greeting');
            el.style.opacity = '0';
            setTimeout(function() {
                el.textContent = list[Math.floor(Math.random() * list.length)];
                el.style.opacity = '1';
            }, 300);
        }

        function getGreetingByTime(h) {
            if (h >= 0 && h < 6) return '夜深了';
            if (h >= 6 && h < 12) return '早上好';
            if (h >= 12 && h < 14) return '中午好';
            if (h >= 14 && h < 18) return '下午好';
            if (h >= 18 && h < 22) return '晚上好';
            return '夜深了';
        }

        function updateTime() {
            var now = new Date();
            var h = now.getHours();
            var greeting = getGreetingByTime(h);
            var h1 = document.querySelector('h1');
            if (h1.textContent !== greeting) {
                h1.style.opacity = '0';
                setTimeout(function() {
                    h1.textContent = greeting;
                    h1.style.opacity = '1';
                }, 200);
            }
            var ts = (h < 10 ? '0' : '') + h + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes() + ':' + (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();
            var ds = now.getFullYear() + '年' + (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1) + '月' + (now.getDate() < 10 ? '0' : '') + now.getDate() + '日';
            var td = document.getElementById('time-display');
            var dd = document.getElementById('date-display');
            td.style.opacity = '0.7';
            setTimeout(function() { td.textContent = ts; td.style.opacity = '1'; }, 50);
            if (dd.textContent !== ds) {
                dd.style.opacity = '0';
                setTimeout(function() { dd.textContent = ds; dd.style.opacity = '1'; }, 200);
            }
        }

        window.onload = function() {
            updateTime();
            setInterval(updateTime, 1000);
            getWeatherData();
            setTimeout(function() {
                updateWeather({ city: '北京', temperature: '22', description: '多云', humidity: '55', windSpeed: '2', weatherType: '多云' });
            }, 500);
        };
    </script>
</body>
</html>
