<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚安问候</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            transition: background 1s ease;
        }
        body.newyear-mode {
            background: #1a0000;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out;
        }
        body.newyear-mode .container {
            background: rgba(0, 0, 0, 0.8);
        }
        h1 {
            color: #333;
            font-size: 3rem;
            margin: 0;
            transition: all 0.5s ease;
        }
        body.newyear-mode h1 {
            color: #ff4444;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff0000;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #ff6600, 0 0 40px #ff0000; }
            to { text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff4400, 0 0 80px #ff0000; }
        }
        p {
            color: #666;
            font-size: 1.2rem;
            margin-top: 15px;
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }
        body.newyear-mode p {
            color: #ffddaa;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .time-container {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }
        .time-display {
            font-size: 1.5rem;
            color: #555;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        body.newyear-mode .time-display { color: #ffcccc; }
        .date-display {
            font-size: 1rem;
            color: #888;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        body.newyear-mode .date-display { color: #ffaa88; }
        .weather-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s ease-out 0.7s forwards;
            transition: all 0.3s ease;
        }
        body.newyear-mode .weather-container {
            background: rgba(139, 0, 0, 0.5);
            border: 2px solid #ffaa00;
        }
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .location {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        body.newyear-mode .location { color: #ffdd00; }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }
        .refresh-btn:hover { background: #764ba2; }
        body.newyear-mode .refresh-btn { background: #cc0000; }
        body.newyear-mode .refresh-btn:hover { background: #ff4444; }
        .weather-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .weather-icon { font-size: 3rem; }
        .temperature {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
        }
        body.newyear-mode .temperature { color: #ffdd00; }
        .weather-details { text-align: left; }
        .weather-desc {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 5px;
        }
        body.newyear-mode .weather-desc { color: #ffcccc; }
        .humidity-wind {
            font-size: 0.9rem;
            color: #888;
        }
        body.newyear-mode .humidity-wind { color: #ffaa88; }
        @media (max-width: 768px) {
            .container { padding: 20px; margin: 20px; }
            h1 { font-size: 2rem; }
        }

        /* 新年专属样式 */
        .newyear-only { display: none; }
        body.newyear-mode .newyear-only { display: block; }
        body.newyear-mode .normal-only { display: none; }

        .lantern {
            font-size: 4rem;
            animation: swing 2s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        .zodiac {
            color: #ffaa66;
            font-size: 1.5rem;
            margin: 10px 0;
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .countdown-item {
            background: linear-gradient(135deg, #8b0000, #cc0000);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 80px;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }
        .countdown-item .number {
            font-size: 2.5rem;
            color: #ffdd00;
            font-weight: bold;
        }
        .countdown-item .label {
            font-size: 0.9rem;
            color: #ffcccc;
            margin-top: 5px;
        }
        .greeting-newyear {
            color: #ffddaa;
            font-size: 1.3rem;
            margin: 20px 0;
            min-height: 60px;
            line-height: 1.8;
            transition: opacity 0.5s;
        }
        .firework-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #cc0000, #ff4444);
            color: #ffdd00;
            border: 2px solid #ffaa00;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }
        .firework-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
        .firework-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .baozhu {
            position: fixed;
            bottom: 0;
            font-size: 2rem;
            animation: rise 3s linear forwards;
            z-index: 50;
        }
        @keyframes rise {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 新年背景元素 -->
    <div class="stars newyear-only" id="stars"></div>
    <canvas class="firework-canvas newyear-only" id="fireworkCanvas"></canvas>

    <div class="container">
        <!-- 新年灯笼 -->
        <div class="lantern newyear-only">🏮</div>

        <!-- 标题：根据模式切换 -->
        <h1 id="title">晚安</h1>

        <!-- 新年生肖 -->
        <div class="zodiac newyear-only" id="zodiac"></div>

        <!-- 新年倒计时 -->
        <div class="countdown newyear-only" id="countdown"></div>

        <!-- 新年祝福语 -->
        <div class="greeting-newyear newyear-only" id="greeting-newyear"></div>

        <!-- 放烟花按钮 -->
        <button class="firework-btn newyear-only" onclick="launchFireworks()">🎆 放烟花</button>

        <!-- 普通页面：问候语 -->
        <p id="normal-greeting">愿你有一个宁静美好的夜晚</p>

        <!-- 时间模块 -->
        <div class="time-container">
            <div class="time-display" id="time-display">--:--:--</div>
            <div class="date-display" id="date-display">----年--月--日</div>
        </div>

        <!-- 天气模块 -->
        <div class="weather-container">
            <div class="weather-header">
                <div class="location" id="location">北京</div>
                <button class="refresh-btn" onclick="getWeatherData()">刷新天气</button>
            </div>
            <div class="weather-info">
                <div class="weather-icon" id="weather-icon">☁️</div>
                <div class="temperature" id="temperature">22°C</div>
                <div class="weather-details">
                    <div class="weather-desc" id="weather-desc">多云</div>
                    <div class="humidity-wind" id="humidity-wind">湿度: 55% | 风速: 2.1 m/s</div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ========== 日期判断：是否为新年模式 ==========
        function isNewYearPeriod() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            // 12月25日 - 1月10日 显示新年模式
            return (month === 12 && day >= 25) || (month === 1 && day <= 10);
        }

        let isNewYear = isNewYearPeriod();
        if (isNewYear) {
            document.body.classList.add('newyear-mode');
        }

        // ========== 新年相关 ==========
        const newYearGreetings = [
            "新年新气象，万事皆如意！",
            "愿新的一年，所求皆所愿，所行化坦途！",
            "爆竹声中一岁除，春风送暖入屠苏！",
            "岁岁常欢愉，年年皆胜意！",
            "愿你新年快乐，阖家幸福，万事顺遂！",
            "新年到，福气到，愿你好运连连！",
            "新年伊始，喜乐无限！",
            "愿新年胜旧年，欢愉且胜意！",
            "新的一年，愿你心中有爱，眼中有光！",
            "金蛇迎春，福满人间！"
        ];

        function getZodiac(year) {
            const animals = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
            return animals[(year - 4) % 12];
        }

        function createStars() {
            const container = document.getElementById('stars');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }

        function updateCountdown() {
            const now = new Date();
            let target = new Date(now.getFullYear(), 0, 1, 0, 0, 0);
            if (now >= target) {
                target = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0);
            }
            const diff = target - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const el = document.getElementById('countdown');
            if (el) {
                el.innerHTML = `
                    <div class="countdown-item"><div class="number">${days}</div><div class="label">天</div></div>
                    <div class="countdown-item"><div class="number">${hours}</div><div class="label">时</div></div>
                    <div class="countdown-item"><div class="number">${minutes}</div><div class="label">分</div></div>
                    <div class="countdown-item"><div class="number">${seconds}</div><div class="label">秒</div></div>
                `;
            }

            const nextYear = target.getFullYear();
            const zodiacEl = document.getElementById('zodiac');
            if (zodiacEl) {
                zodiacEl.textContent = `${nextYear}年 ${getZodiac(nextYear)}年`;
            }
        }

        function updateNewYearGreeting() {
            const el = document.getElementById('greeting-newyear');
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                el.textContent = newYearGreetings[Math.floor(Math.random() * newYearGreetings.length)];
                el.style.opacity = '1';
            }, 300);
        }

        // 烟花
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let particles = [];

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.size = Math.random() * 3 + 1;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.05; this.alpha -= 0.015;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill(); ctx.restore();
            }
        }

        function createFirework(x, y) {
            if (!ctx) return;
            const colors = ['#ff0000','#ffaa00','#ffff00','#ff6600','#ff44ff','#00ffaa','#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 80; i++) particles.push(new Particle(x, y, color));
        }

        function animateFireworks() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateFireworks);
        }

        function launchFireworks() {
            if (!canvas) return;
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * canvas.width * 0.6 + canvas.width * 0.2,
                        Math.random() * canvas.height * 0.5 + canvas.height * 0.1
                    );
                }, i * 300);
            }
        }

        function launchBaozhu() {
            if (!isNewYear) return;
            const baozhu = document.createElement('div');
            baozhu.className = 'baozhu';
            baozhu.textContent = Math.random() > 0.5 ? '🧨' : '🎇';
            baozhu.style.left = Math.random() * 100 + '%';
            baozhu.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(baozhu);
            setTimeout(() => baozhu.remove(), 4000);
        }

        // ========== 普通页面：天气相关 ==========
        const amapApiKey = API_CONFIG.amapApiKey;
        const weatherIcons = {
            '晴': '☀️', '多云': '☁️', '阴': '☁️', '小雨': '🌦️', '中雨': '🌧️',
            '大雨': '⛈️', '暴雨': '⛈️', '雷阵雨': '⛈️', '小雪': '❄️', '中雪': '❄️',
            '大雪': '❄️', '雾': '🌫️', '霾': '🌫️', 'default': '☀️'
        };
        let currentWeatherData = null;
        const regionMap = {
            '华中地区': '武汉', '华北地区': '北京', '华东地区': '上海',
            '华南地区': '广州', '西北地区': '西安', '西南地区': '成都', '东北地区': '沈阳'
        };

        function getWeatherData() {
            updateLoadingState();
            getLocationByIP();
        }

        function updateLoadingState() {
            document.getElementById('temperature').textContent = '加载中...';
            document.getElementById('weather-desc').textContent = '获取天气信息中...';
            document.getElementById('humidity-wind').textContent = '';
        }

        function getLocationByIP() {
            const amapIpLocationUrl = `https://restapi.amap.com/v3/ip?key=${amapApiKey}`;
            const callbackName = 'amapIpCallback_' + Date.now();
            window[callbackName] = function(data) {
                if (data.status === '1') {
                    let cityName = data.city || data.province;
                    if (regionMap[cityName]) cityName = regionMap[cityName];
                    getWeatherByCity(cityName);
                } else {
                    document.getElementById('temperature').textContent = '定位失败';
                    document.getElementById('weather-desc').textContent = `错误: ${data.info || '未知错误'}`;
                }
                cleanupJsonpScript(callbackName);
            };
            createJsonpScript(`${amapIpLocationUrl}&output=jsonp&callback=${callbackName}`, callbackName);
        }

        function createJsonpScript(url, callbackName) {
            const script = document.createElement('script');
            script.id = `jsonp-${callbackName}`;
            script.src = url;
            script.onerror = function() {
                document.getElementById('temperature').textContent = '请求失败';
                document.getElementById('weather-desc').textContent = '无法连接到定位服务';
                cleanupJsonpScript(callbackName);
            };
            document.head.appendChild(script);
        }

        function cleanupJsonpScript(callbackName) {
            setTimeout(() => {
                const script = document.getElementById(`jsonp-${callbackName}`);
                if (script && script.parentNode) script.parentNode.removeChild(script);
                delete window[callbackName];
            }, 0);
        }

        function getWeatherByCity(cityName) {
            const geocodeUrl = `https://restapi.amap.com/v3/geocode/geo?address=${encodeURIComponent(cityName)}&key=${amapApiKey}`;
            const geocodeCallbackName = 'amapGeocodeCallback_' + Date.now();
            window[geocodeCallbackName] = function(data) {
                if (data.status === '1' && data.geocodes && data.geocodes.length > 0) {
                    const location = data.geocodes[0].location;
                    const [lon, lat] = location.split(',').map(coord => parseFloat(coord));
                    getAmapWeather(lat, lon, cityName);
                } else {
                    document.getElementById('temperature').textContent = '获取失败';
                    document.getElementById('weather-desc').textContent = '无法获取城市信息';
                }
                cleanupJsonpScript(geocodeCallbackName);
            };
            createJsonpScript(`${geocodeUrl}&output=jsonp&callback=${geocodeCallbackName}`, geocodeCallbackName);
        }

        function getAmapWeather(lat, lon, cityName) {
            const regeoUrl = `https://restapi.amap.com/v3/geocode/regeo?location=${lon},${lat}&key=${amapApiKey}`;
            const regeoCallbackName = 'amapRegeoCallback_' + Date.now();
            window[regeoCallbackName] = function(data) {
                if (data.status === '1' && data.regeocode && data.regeocode.addressComponent) {
                    const adcode = data.regeocode.addressComponent.adcode;
                    if (adcode) fetchWeatherWithAdcode(adcode, cityName);
                    else displayMockWeather(cityName);
                }
                cleanupJsonpScript(regeoCallbackName);
            };
            createJsonpScript(`${regeoUrl}&output=jsonp&callback=${regeoCallbackName}`, regeoCallbackName);
        }

        function fetchWeatherWithAdcode(adcode, cityName) {
            const weatherUrl = `https://restapi.amap.com/v3/weather/weatherInfo?city=${adcode}&key=${amapApiKey}`;
            const weatherCallbackName = 'amapWeatherCallback_' + Date.now();
            window[weatherCallbackName] = function(data) {
                if (data.status === '1' && data.lives && data.lives.length > 0) {
                    const w = data.lives[0];
                    updateWeatherDisplay({
                        city: cityName, temperature: w.temperature, description: w.weather,
                        humidity: w.humidity, windSpeed: w.windpower, weatherType: w.weather
                    });
                } else {
                    displayMockWeather(cityName);
                }
                cleanupJsonpScript(weatherCallbackName);
            };
            createJsonpScript(`${weatherUrl}&output=jsonp&callback=${weatherCallbackName}`, weatherCallbackName);
        }

        function displayMockWeather(cityName) {
            updateWeatherDisplay({
                city: cityName || '未知位置', temperature: '--', description: '未知',
                humidity: '--', windSpeed: '--', weatherType: 'default'
            });
        }

        function updateWeatherDisplay(weatherData) {
            currentWeatherData = weatherData;
            const weatherContainer = document.querySelector('.weather-container');
            weatherContainer.style.transform = 'translateY(5px)';
            weatherContainer.style.opacity = '0.9';
            setTimeout(() => {
                document.getElementById('location').textContent = weatherData.city;
                document.getElementById('temperature').textContent = weatherData.temperature + '°C';
                document.getElementById('weather-icon').textContent = weatherIcons[weatherData.weatherType] || weatherIcons.default;
                document.getElementById('weather-desc').textContent = weatherData.description;
                document.getElementById('humidity-wind').textContent = `湿度: ${weatherData.humidity}% | 风速: ${weatherData.windSpeed} 级`;
                weatherContainer.style.transform = 'translateY(0)';
                weatherContainer.style.opacity = '1';
            }, 200);
            updateInspirationalQuote();
        }

        function updateInspirationalQuote() {
            if (!currentWeatherData) return;
            const city = currentWeatherData.city || '未知位置';
            const weather = currentWeatherData.description || '未知天气';
            const temperature = currentWeatherData.temperature || '--';
            const hour = new Date().getHours();
            const greetings = [
                `${city}的${hour}点，${weather}${temperature}°C，愿你心情如阳光般温暖！`,
                `${weather}的${city}，${temperature}°C，${hour}点的时光最适合享受生活！`,
                `在${city}${weather}的${hour}点，${temperature}°C的温度，祝你有个愉快的一天！`,
                `${hour}点的${city}，${weather}宜人，${temperature}°C正舒适，一切都会好起来的！`,
                `今天${city}${weather}，${temperature}°C，${hour}点的你，最美最棒！`
            ];
            const el = document.getElementById('normal-greeting');
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                el.style.opacity = '1';
            }, 300);
        }

        // ========== 时间更新（通用） ==========
        function getGreetingByTime(hour) {
            if (hour >= 0 && hour < 6) return { greeting: '夜深了', subtitle: '早点休息，做个好梦' };
            else if (hour >= 6 && hour < 12) return { greeting: '早上好', subtitle: '新的一天，充满活力' };
            else if (hour >= 12 && hour < 14) return { greeting: '中午好', subtitle: '午休时间，放松一下' };
            else if (hour >= 14 && hour < 18) return { greeting: '下午好', subtitle: '下午时光，继续加油' };
            else if (hour >= 18 && hour < 22) return { greeting: '晚上好', subtitle: '晚上愉快，享受休闲时光' };
            else return { greeting: '夜深了', subtitle: '早点休息，晚安' };
        }

        function updateTime() {
            const now = new Date();
            const hour = now.getHours();
            const greetingInfo = getGreetingByTime(hour);
            const h1Element = document.getElementById('title');

            // 新年模式下标题固定
            if (!isNewYear && h1Element.textContent !== greetingInfo.greeting) {
                h1Element.style.opacity = '0';
                setTimeout(() => {
                    h1Element.textContent = greetingInfo.greeting;
                    h1Element.style.opacity = '1';
                }, 200);
            } else if (isNewYear) {
                h1Element.textContent = '新年快乐';
            }

            const hours = hour.toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const dateString = `${year}年${month}月${day}日`;

            const timeDisplay = document.getElementById('time-display');
            const dateDisplay = document.getElementById('date-display');
            timeDisplay.style.opacity = '0.7';
            setTimeout(() => {
                timeDisplay.textContent = timeString;
                timeDisplay.style.opacity = '1';
            }, 50);
            if (dateDisplay.textContent !== dateString) {
                dateDisplay.style.opacity = '0';
                setTimeout(() => {
                    dateDisplay.textContent = dateString;
                    dateDisplay.style.opacity = '1';
                }, 200);
            }
        }

        // ========== 初始化 ==========
        window.onload = function() {
            updateTime();
            setInterval(updateTime, 1000);

            if (isNewYear) {
                document.title = '新年快乐';
                resizeCanvas();
                createStars();
                animateFireworks();
                updateCountdown();
                updateNewYearGreeting();
                setInterval(updateCountdown, 1000);
                setInterval(updateNewYearGreeting, 5000);
                setInterval(launchBaozhu, 2000);
                setTimeout(launchFireworks, 1000);
            } else {
                document.title = '晚安问候';
                getWeatherData();
                setTimeout(() => {
                    updateWeatherDisplay({
                        city: '北京', temperature: '22', description: '多云',
                        humidity: '55', windSpeed: '2', weatherType: '多云'
                    });
                }, 500);
            }
        };
    </script>
</body>
</html>
