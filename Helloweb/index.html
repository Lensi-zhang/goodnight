<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="温馨的晚安问候网页，显示实时时间和天气">
    <meta name="theme-color" content="#f2ebdc">
    <title>晚安 · Goodnight</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        // 首屏前同步主题，避免闪烁
        (function () {
            try {
                var saved = localStorage.getItem('goodnight_dark_mode');
                var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            } catch (e) { }
        })();
    </script>
    <style>
        :root {
            --paper: #f2ebdc;
            --paper-2: #e7ddca;
            --ink: #211e18;
            --ink-soft: #4f483c;
            --ink-mute: #776d5d;
            --vermilion: #a83b2b;
            --vermilion-deep: #8c2d20;
            --line: rgba(33, 30, 24, 0.2);
            --line-soft: rgba(33, 30, 24, 0.09);
            --frame: rgba(33, 30, 24, 0.22);
            --wash: rgba(72, 66, 54, 0.09);
            --grain: 0.055;
            --font-serif: "Cormorant Garamond", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", serif;
            --font-sans: "Jost", "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        :root[data-theme="dark"] {
            --paper: #14120f;
            --paper-2: #1c1813;
            --ink: #ece3d2;
            --ink-soft: #b9af9c;
            --ink-mute: #877c6a;
            --vermilion: #c05a44;
            --vermilion-deep: #a63c2b;
            --line: rgba(236, 227, 210, 0.17);
            --line-soft: rgba(236, 227, 210, 0.07);
            --frame: rgba(192, 90, 68, 0.26);
            --wash: rgba(236, 227, 210, 0.06);
            --grain: 0.075;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(3.6rem, 8vh, 6rem) clamp(1.5rem, 6vw, 5.5rem);
            overflow-x: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-feature-settings: "lnum" 1;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s var(--ease), color 0.5s var(--ease);
        }

        /* 宣纸底色 */
        body::before {
            content: "";
            position: fixed;
            inset: -15%;
            z-index: -3;
            background:
                radial-gradient(52% 42% at 80% 8%, var(--wash), transparent 68%),
                radial-gradient(46% 38% at 6% 92%, rgba(120, 100, 70, 0.1), transparent 72%),
                linear-gradient(172deg, var(--paper) 0%, var(--paper-2) 100%);
            transition: background 0.5s var(--ease);
        }

        /* 纸纤维颗粒 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: var(--grain);
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' stitchTiles='stitch'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.6'/></svg>");
        }

        :root[data-theme="dark"] body::after {
            mix-blend-mode: screen;
        }

        /* 淡墨晕染 */
        .ink-wash {
            position: fixed;
            left: -12vw;
            top: -10vh;
            width: 64vmin;
            height: 50vmin;
            z-index: -2;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 50%, rgba(33, 30, 24, 0.13), rgba(33, 30, 24, 0.04) 55%, transparent 74%);
            filter: blur(22px);
            pointer-events: none;
        }

        :root[data-theme="dark"] .ink-wash {
            background: radial-gradient(ellipse at 50% 50%, rgba(236, 227, 210, 0.09), rgba(236, 227, 210, 0.03) 55%, transparent 74%);
        }

        /* 极简外框 */
        .frame {
            position: fixed;
            inset: 18px;
            z-index: 2;
            border: 1px solid var(--frame);
            pointer-events: none;
            transition: border-color 0.5s var(--ease);
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            border: 1px solid var(--vermilion);
            opacity: 0.6;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: 0;
            border-bottom: 0;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: 0;
            border-top: 0;
        }

        /* 竖向题字 */
        .side-rail {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            writing-mode: vertical-rl;
            font-family: var(--font-serif);
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.55em;
            color: var(--ink-mute);
            opacity: 0.7;
            pointer-events: none;
        }

        .side-rail::before {
            content: "";
            display: block;
            width: 1px;
            height: 34px;
            margin: 0 auto 0.9rem;
            background: var(--line);
        }

        /* 淡墨印章水印 */
        .ghost-seal {
            position: fixed;
            left: -5vw;
            bottom: -8vh;
            width: 36vmin;
            aspect-ratio: 1;
            z-index: -1;
            display: grid;
            place-items: center;
            font-family: var(--font-serif);
            font-size: 11vmin;
            color: rgba(168, 59, 43, 0.09);
            transform: rotate(-6deg);
            pointer-events: none;
        }

        :root[data-theme="dark"] .ghost-seal {
            color: rgba(192, 90, 68, 0.12);
        }

        .skip-link {
            position: fixed;
            top: -60px;
            left: 24px;
            z-index: 10;
            padding: 10px 18px;
            background: var(--ink);
            color: var(--paper);
            font-size: 0.78rem;
            letter-spacing: 0.2em;
            text-decoration: none;
            transition: top 0.2s var(--ease);
        }

        .skip-link:focus {
            top: 24px;
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 940px;
        }

        .container {
            width: 100%;
        }

        /* 顶部 */
        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            padding-bottom: 1.05rem;
            border-bottom: 1px solid var(--line-soft);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.9rem;
            color: inherit;
            text-decoration: none;
        }

        .brand-name {
            font-family: var(--font-serif);
            font-weight: 500;
            font-size: 1.24rem;
            letter-spacing: 0.3em;
            line-height: 1;
        }

        .seal {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            background: linear-gradient(160deg, var(--vermilion), var(--vermilion-deep));
            color: #f7efe0;
            font-family: var(--font-serif);
            font-size: 0.92rem;
            line-height: 1;
            box-shadow: inset 0 0 0 2px rgba(247, 239, 224, 0.34), 0 3px 10px rgba(140, 45, 32, 0.22);
            transform: rotate(-4deg);
            flex: 0 0 auto;
        }

        .brand-en {
            font-size: 0.6rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--ink-mute);
            padding-left: 0.9rem;
            border-left: 1px solid var(--line);
        }

        .masthead-right {
            display: flex;
            align-items: center;
            gap: 1.1rem;
        }

        .select-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .select-wrap::after {
            content: "▾";
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-54%);
            color: var(--vermilion);
            font-size: 0.6rem;
            pointer-events: none;
        }

        .city-selector {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--line);
            color: var(--ink-soft);
            font-family: var(--font-sans);
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.22em;
            padding: 5px 20px 6px 1px;
            cursor: pointer;
            max-width: 8.5rem;
            transition: border-color 0.3s var(--ease), color 0.3s var(--ease);
        }

        .city-selector:hover {
            border-color: var(--vermilion);
            color: var(--vermilion);
        }

        .city-selector:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 4px;
        }

        .city-selector option {
            background: var(--paper);
            color: var(--ink);
            letter-spacing: 0.05em;
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font-family: var(--font-serif);
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.35s var(--ease), border-color 0.35s var(--ease), transform 0.35s var(--ease);
        }

        .theme-toggle:hover {
            color: var(--vermilion);
            border-color: var(--vermilion);
            transform: rotate(-6deg);
        }

        .theme-toggle:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 3px;
        }

        /* 主视觉 */
        .hero {
            padding-top: clamp(2.8rem, 7vh, 5rem);
        }

        .eyebrow-row {
            display: flex;
            align-items: baseline;
            gap: 1.4rem;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-serif);
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.45em;
            color: var(--ink-soft);
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            background: var(--vermilion);
            flex: 0 0 auto;
        }

        .eyebrow-en {
            font-size: 0.58rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: var(--ink-mute);
        }

        h1 {
            margin: 1.3rem 0 0;
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(3.7rem, 9.6vw, 7.5rem);
            line-height: 1.08;
            letter-spacing: 0.2em;
            color: var(--ink);
            transition: color 0.5s var(--ease), opacity 0.35s var(--ease);
        }

        .greeting {
            max-width: 28rem;
            margin-top: 1.5rem;
            padding-left: 1.1rem;
            border-left: 1px solid var(--vermilion);
            font-family: var(--font-serif);
            font-size: 0.9rem;
            font-weight: 400;
            line-height: 2.05;
            letter-spacing: 0.12em;
            color: var(--ink-soft);
            transition: color 0.5s var(--ease), opacity 0.35s var(--ease);
        }

        .ornament {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: clamp(2.1rem, 5vh, 3.3rem) 0 clamp(1.9rem, 4.4vh, 2.9rem);
            max-width: 400px;
        }

        .ornament span {
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .ornament i {
            width: 5px;
            height: 5px;
            background: var(--vermilion);
            flex: 0 0 auto;
        }

        .time-container {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .time-label {
            font-family: var(--font-serif);
            font-size: 0.66rem;
            letter-spacing: 0.4em;
            color: var(--ink-mute);
        }

        .time-display {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2.7rem, 6.2vw, 4.8rem);
            line-height: 1;
            letter-spacing: 0.09em;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            transition: color 0.5s var(--ease);
        }

        .date-display {
            font-family: var(--font-serif);
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            color: var(--ink-mute);
            transition: color 0.5s var(--ease), opacity 0.35s var(--ease);
        }

        /* 天气题栏 */
        .weather-container {
            margin-top: clamp(2.2rem, 6vh, 3.6rem);
            padding: 1.5rem 0 1.3rem;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            transition: border-color 0.4s var(--ease), opacity 0.4s var(--ease), transform 0.4s var(--ease);
        }

        .weather-container:hover {
            border-color: var(--vermilion);
        }

        .weather-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1.2rem;
        }

        .weather-heading {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.36em;
            color: var(--ink-mute);
        }

        .label::before {
            content: "";
            width: 1px;
            height: 13px;
            background: var(--vermilion);
        }

        .location {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            color: var(--ink);
            transition: color 0.5s var(--ease);
        }

        .refresh-btn {
            appearance: none;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font-family: var(--font-serif);
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            padding: 0.35rem 0.1rem 0.3rem;
            cursor: pointer;
            transition: color 0.35s var(--ease), border-color 0.35s var(--ease);
        }

        .refresh-btn:hover {
            color: var(--vermilion);
            border-color: var(--vermilion);
        }

        .refresh-btn:active {
            transform: translateY(1px);
        }

        .refresh-btn:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 3px;
        }

        .weather-info {
            display: grid;
            grid-template-columns: auto auto 1fr;
            align-items: center;
            gap: clamp(1.2rem, 3vw, 2.4rem);
            margin-top: 1.3rem;
        }

        .weather-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            font-size: 1.05rem;
            filter: grayscale(1) sepia(0.18) contrast(0.85);
            opacity: 0.8;
        }

        :root[data-theme="dark"] .weather-icon {
            filter: grayscale(0.7) brightness(1.4) sepia(0.3);
        }

        .temperature {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(1.9rem, 3.4vw, 2.5rem);
            line-height: 1;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            transition: color 0.5s var(--ease);
        }

        .weather-details {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 0;
            padding-left: clamp(1rem, 2.4vw, 1.8rem);
            border-left: 1px solid var(--line-soft);
        }

        .weather-desc {
            font-family: var(--font-serif);
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.16em;
            color: var(--ink-soft);
            transition: color 0.5s var(--ease);
        }

        .humidity-wind {
            font-size: 0.63rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            color: var(--ink-mute);
            transition: color 0.5s var(--ease);
        }

        /* 页脚 */
        .page-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: clamp(1.6rem, 4vh, 2.3rem);
            font-family: var(--font-serif);
            font-size: 0.64rem;
            letter-spacing: 0.3em;
            color: var(--ink-mute);
        }

        .page-foot span:last-child {
            font-family: var(--font-sans);
            font-size: 0.56rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* 墨迹入场 */
        .masthead,
        .eyebrow-row,
        h1,
        .greeting,
        .ornament,
        .time-container,
        .weather-container,
        .page-foot {
            animation: inkIn 1.1s var(--ease) backwards;
        }

        .eyebrow-row { animation-delay: 0.16s; }
        h1 { animation-delay: 0.3s; }
        .greeting { animation-delay: 0.44s; }
        .ornament { animation-delay: 0.56s; }
        .time-container { animation-delay: 0.68s; }
        .weather-container { animation-delay: 0.82s; }
        .page-foot { animation-delay: 0.96s; }

        @keyframes inkIn {
            from {
                opacity: 0;
                filter: blur(7px);
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 900px) {
            .side-rail {
                display: none;
            }
        }

        @media (max-width: 640px) {
            .frame {
                inset: 10px;
            }

            .ghost-seal {
                display: none;
            }

            .ink-wash {
                left: -30vw;
                top: -4vh;
                width: 84vmin;
            }

            .masthead {
                align-items: flex-start;
                flex-direction: column;
                gap: 1rem;
            }

            .brand-en {
                display: none;
            }

            .masthead-right {
                width: 100%;
                justify-content: space-between;
            }

            .weather-header {
                align-items: flex-end;
            }

            .weather-info {
                grid-template-columns: auto 1fr;
                row-gap: 0.9rem;
            }

            .weather-details {
                grid-column: 1 / -1;
                padding-left: 0;
                padding-top: 0.9rem;
                border-left: 0;
                border-top: 1px solid var(--line-soft);
            }

            .page-foot {
                align-items: flex-start;
                flex-direction: column;
                gap: 0.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳转到主要内容</a>
    <div class="frame" aria-hidden="true"></div>
    <div class="ink-wash" aria-hidden="true"></div>
    <div class="ghost-seal" aria-hidden="true">夜</div>
    <div class="side-rail" aria-hidden="true">夜阑人静</div>

    <main id="main-content" role="main">
        <article class="container" role="article" aria-labelledby="greeting-title">
            <header class="masthead">
                <a class="brand" href="index.html" aria-label="晚安问候首页">
                    <span class="brand-name">晚安</span>
                    <span class="seal" aria-hidden="true">安</span>
                    <span class="brand-en">Goodnight</span>
                </a>
                <div class="masthead-right">
                    <div class="select-wrap">
                        <label for="citySelector" class="visually-hidden">选择城市</label>
                        <select id="citySelector" class="city-selector" aria-label="城市选择">
                            <option value="">城市</option>
                        </select>
                    </div>
                    <button type="button" id="themeToggle" class="theme-toggle" aria-label="切换深色模式">月</button>
                </div>
            </header>

            <section class="hero" aria-labelledby="greeting-title">
                <div class="eyebrow-row">
                    <p class="eyebrow">夜之序</p>
                    <span class="eyebrow-en">A Quiet Night</span>
                </div>

                <h1 id="greeting-title">晚安</h1>
                <p id="greeting" class="greeting" aria-live="polite">愿你有一个宁静美好的夜晚</p>

                <div class="ornament" aria-hidden="true">
                    <span></span><i></i><span></span>
                </div>

                <div class="time-container" aria-label="当前时间">
                    <span class="time-label">此刻</span>
                    <div class="time-display" id="time-display" role="timer" aria-label="时间">--:--:--</div>
                    <div class="date-display" id="date-display" aria-label="日期">--年--月--日</div>
                </div>
            </section>

            <section class="weather-container" aria-label="天气信息">
                <div class="weather-header">
                    <div class="weather-heading">
                        <span class="label">天气</span>
                        <div class="location" id="location" aria-label="城市">北京</div>
                    </div>
                    <button type="button" class="refresh-btn" onclick="getWeatherData()" aria-label="刷新天气">刷新</button>
                </div>
                <div class="weather-info">
                    <div class="weather-icon" id="weather-icon" aria-hidden="true">☁️</div>
                    <div class="temperature" id="temperature" aria-label="温度">—</div>
                    <div class="weather-details">
                        <div class="weather-desc" id="weather-desc">待获取</div>
                        <div class="humidity-wind" id="humidity-wind">配置 API Key 后显示</div>
                    </div>
                </div>
            </section>

            <footer class="page-foot">
                <span>愿长夜安宁</span>
                <span>Goodnight · MMXXVI</span>
            </footer>
        </article>
    </main>

    <script src="config.js"></script>
    <script src="lunar.js"></script>
    <script src="darkmode.js"></script>
    <script src="time.js"></script>
    <script src="weather.js"></script>
    <script>
        // 农历新年或公历新年期间跳转到对应页面
        (function () {
            var now = new Date();
            var m = now.getMonth() + 1;
            var d = now.getDate();
            // 公历新年：12月31日 - 1月1日
            if ((m === 12 && d === 31) || (m === 1 && d === 1)) {
                window.location.href = 'gregorian.html';
                return;
            }
            // 农历新年：新年前7天 ~ 新年后15天
            if (LunarNewYear.isDuringNewYear()) {
                window.location.href = 'newyear.html';
                return;
            }
        })();

        // 临时测试入口 - 手动跳转
        window.openGregorianNewYear = function () {
            window.location.href = 'gregorian.html';
        };
        window.openLunarNewYear = function () {
            window.location.href = 'newyear.html';
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function () {
            DarkModeModule.init();
            TimeModule.start();
            initCitySelector();
            getWeatherData();
        });

        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js')
                    .then(function (registration) {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch(function (error) {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
