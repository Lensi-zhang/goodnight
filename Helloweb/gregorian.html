<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12100d">
    <title>新年快乐 · New Year</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #12100d;
            --paper-2: #080706;
            --ink: #efe5d3;
            --ink-soft: #bcb1a0;
            --ink-mute: #857b6b;
            --vermilion: #c05a44;
            --vermilion-deep: #9e3f2c;
            --line: rgba(239, 229, 211, 0.17);
            --line-soft: rgba(239, 229, 211, 0.07);
            --frame: rgba(192, 90, 68, 0.28);
            --wash: rgba(239, 229, 211, 0.07);
            --font-serif: "Cormorant Garamond", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", serif;
            --font-sans: "Jost", "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            color-scheme: dark;
        }

        ::selection {
            background: var(--vermilion);
            color: var(--paper);
        }

        /* 返回入口 */
        .home-link {
            position: fixed;
            top: clamp(1.5rem, 3.2vh, 2.3rem);
            left: clamp(1.6rem, 4vw, 3rem);
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.62rem;
            letter-spacing: 0.3em;
            color: var(--ink-mute);
            text-decoration: none;
            transition: color 0.35s var(--ease);
        }

        .home-link .mark {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border: 1px solid var(--line);
            color: var(--vermilion);
            font-size: 0.72rem;
            letter-spacing: 0;
            transition: border-color 0.35s var(--ease), transform 0.35s var(--ease);
        }

        .home-link:hover {
            color: var(--ink);
        }

        .home-link:hover .mark {
            border-color: var(--vermilion);
            transform: rotate(-6deg);
        }

        .home-link:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 4px;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(3.6rem, 9vh, 6rem) clamp(1.4rem, 6vw, 4.5rem);
            overflow-x: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-feature-settings: "lnum" 1;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -3;
            background:
                radial-gradient(50% 42% at 50% 110%, rgba(192, 90, 68, 0.22), transparent 70%),
                radial-gradient(38% 34% at 86% 6%, var(--wash), transparent 70%),
                linear-gradient(176deg, var(--paper) 0%, var(--paper-2) 100%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.075;
            mix-blend-mode: screen;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' stitchTiles='stitch'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.6'/></svg>");
        }

        .ink-wash {
            position: fixed;
            right: -14vw;
            top: -12vh;
            width: 62vmin;
            height: 50vmin;
            z-index: -2;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 50%, rgba(239, 229, 211, 0.1), rgba(239, 229, 211, 0.03) 55%, transparent 74%);
            filter: blur(24px);
            pointer-events: none;
        }

        .frame {
            position: fixed;
            inset: 18px;
            z-index: 2;
            border: 1px solid var(--frame);
            pointer-events: none;
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            border: 1px solid var(--vermilion);
            opacity: 0.7;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: 0;
            border-bottom: 0;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: 0;
            border-top: 0;
        }

        .side-rail {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            writing-mode: vertical-rl;
            font-family: var(--font-serif);
            font-size: 0.82rem;
            letter-spacing: 0.55em;
            color: var(--ink-mute);
            opacity: 0.7;
            pointer-events: none;
        }

        .side-rail::before {
            content: "";
            display: block;
            width: 1px;
            height: 34px;
            margin: 0 auto 0.9rem;
            background: var(--line);
        }

        .ghost-seal {
            position: fixed;
            right: -4vw;
            bottom: -7vh;
            width: 34vmin;
            aspect-ratio: 1;
            z-index: -1;
            display: grid;
            place-items: center;
            font-family: var(--font-serif);
            font-size: 10vmin;
            color: rgba(192, 90, 68, 0.12);
            transform: rotate(6deg);
            pointer-events: none;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            contain: layout paint;
        }

        .star {
            position: absolute;
            background: rgba(239, 229, 211, 0.7);
            border-radius: 50%;
            will-change: opacity;
            animation: twinkle 3.4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.16; }
            to { opacity: 0.8; }
        }

        .stage {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 840px;
            text-align: center;
            animation: inkIn 1.2s var(--ease) backwards;
        }

        .seal {
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            background: linear-gradient(160deg, var(--vermilion), var(--vermilion-deep));
            color: #f7efe0;
            font-family: var(--font-serif);
            font-size: 1rem;
            line-height: 1;
            box-shadow: inset 0 0 0 2px rgba(247, 239, 224, 0.34), 0 4px 18px rgba(158, 63, 44, 0.35);
        }

        .stage-seal {
            position: absolute;
            top: 0;
            right: 0;
            transform: rotate(5deg);
            animation: inkIn 1.1s var(--ease) 0.1s backwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            font-family: var(--font-serif);
            font-size: 0.74rem;
            letter-spacing: 0.45em;
            color: var(--ink-soft);
            animation: inkIn 1.1s var(--ease) 0.18s backwards;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";
            width: 6px;
            height: 6px;
            background: var(--vermilion);
        }

        h1 {
            margin-top: 1.6rem;
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2.1rem, 4.8vw, 3.1rem);
            letter-spacing: 0.34em;
            line-height: 1.15;
            color: var(--ink);
            animation: inkIn 1.1s var(--ease) 0.3s backwards;
        }

        .year-display {
            margin-top: 1.2rem;
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: clamp(5rem, 16vw, 10.5rem);
            line-height: 0.95;
            letter-spacing: 0.07em;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            animation: inkIn 1.2s var(--ease) 0.42s backwards;
        }

        .year-label {
            margin-top: 0.9rem;
            font-family: var(--font-serif);
            font-size: 0.64rem;
            letter-spacing: 0.4em;
            color: var(--ink-mute);
            animation: inkIn 1s var(--ease) 0.52s backwards;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin: clamp(2.3rem, 6vh, 3.4rem) auto 0;
            max-width: 590px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            animation: inkIn 1.1s var(--ease) 0.62s backwards;
        }

        .countdown-item {
            position: relative;
            padding: 1.4rem 0.5rem 1.25rem;
            contain: layout style;
        }

        .countdown-item + .countdown-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 1.4rem;
            bottom: 1.25rem;
            width: 1px;
            background: var(--line-soft);
        }

        .countdown-item .number {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2rem, 4.8vw, 3rem);
            line-height: 1;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }

        .countdown-item .label {
            margin-top: 0.65rem;
            font-family: var(--font-serif);
            font-size: 0.62rem;
            letter-spacing: 0.4em;
            color: var(--vermilion);
        }

        .greeting {
            max-width: 32rem;
            margin: clamp(1.8rem, 4vh, 2.5rem) auto 0;
            min-height: 3.4rem;
            font-family: var(--font-serif);
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 2.05;
            letter-spacing: 0.14em;
            color: var(--ink-soft);
            padding: 0 1rem;
            transition: opacity 0.5s var(--ease);
            animation: inkIn 1s var(--ease) 0.72s backwards;
        }

        .celebrate-btn {
            margin-top: clamp(1.4rem, 4vh, 2.1rem);
            appearance: none;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font-family: var(--font-serif);
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            padding: 0.95rem 2.2rem 0.9rem 2.5rem;
            cursor: pointer;
            transition: color 0.4s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease);
            animation: inkIn 1s var(--ease) 0.82s backwards;
        }

        .celebrate-btn:hover {
            color: #f7efe0;
            background: var(--vermilion-deep);
            border-color: var(--vermilion);
        }

        .celebrate-btn:active {
            transform: translateY(1px);
        }

        .celebrate-btn:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 4px;
        }

        .page-foot {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 840px;
            margin-top: clamp(2.4rem, 6vh, 3.4rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-family: var(--font-serif);
            font-size: 0.62rem;
            letter-spacing: 0.32em;
            color: var(--ink-mute);
            animation: inkIn 1s var(--ease) 0.92s backwards;
        }

        .page-foot span:last-child {
            font-family: var(--font-sans);
            font-size: 0.54rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* 金色纸屑改为纸色与朱砂纸片 */
        .confetti {
            position: fixed;
            top: 0;
            width: 3px;
            height: 14px;
            border-radius: 1px;
            animation: fall 3s linear forwards;
            z-index: 100;
            will-change: transform, opacity;
            contain: layout style;
        }

        @keyframes fall {
            0% { transform: translate3d(0, -12vh, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate3d(0, 108vh, 0) rotate(720deg); opacity: 0; }
        }

        /* 上升的纸灯笼 */
        .balloon {
            position: fixed;
            bottom: 0;
            width: 13px;
            height: 17px;
            border: 1px solid rgba(192, 90, 68, 0.65);
            border-radius: 50% 50% 50% 50%;
            background: rgba(192, 90, 68, 0.16);
            opacity: 0.4;
            animation: float 5s ease-in forwards;
            z-index: 90;
            will-change: transform, opacity;
            contain: layout style;
        }

        .balloon::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 1px;
            height: 16px;
            background: linear-gradient(rgba(192, 90, 68, 0.55), transparent);
        }

        @keyframes float {
            0% { transform: translate3d(0, 10vh, 0) rotate(-4deg); opacity: 0; }
            15% { opacity: 0.4; }
            100% { transform: translate3d(0, -105vh, 0) rotate(5deg); opacity: 0; }
        }

        @keyframes inkIn {
            from {
                opacity: 0;
                filter: blur(7px);
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .side-rail {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .frame { inset: 10px; }

            .ghost-seal {
                display: none;
            }

            .stage-seal {
                position: static;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                margin: 0 auto 1.2rem;
                transform: rotate(4deg);
            }

            h1 { letter-spacing: 0.24em; }

            .countdown-item { padding: 1.1rem 0.3rem 0.95rem; }

            .countdown-item + .countdown-item::before {
                top: 1.1rem;
                bottom: 0.95rem;
            }

            .countdown-item .number { font-size: 1.8rem; }

            .page-foot {
                align-items: center;
                flex-direction: column;
                gap: 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <a class="home-link" href="index.html" aria-label="返回晚安首页">
        <span class="mark" aria-hidden="true">归</span>
        <span>晚安</span>
    </a>
    <div class="frame" aria-hidden="true"></div>
    <div class="ink-wash" aria-hidden="true"></div>
    <div class="ghost-seal" aria-hidden="true">元</div>
    <div class="side-rail" aria-hidden="true">一元复始</div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <main class="stage">
        <span class="seal stage-seal" aria-hidden="true">元</span>
        <p class="eyebrow">元旦 · 新岁</p>
        <h1>新年快乐</h1>
        <div class="year-display" id="yearDisplay"></div>
        <div class="year-label">岁之元 · 月之元 · 日之元</div>
        <div class="countdown" id="countdown" aria-label="新年倒计时"></div>
        <div class="greeting" id="greeting" aria-live="polite"></div>
        <button class="celebrate-btn" id="celebrateBtn" type="button">点此迎新</button>
    </main>

    <footer class="page-foot" aria-hidden="true">
        <span>愿岁并谢 · 与长友兮</span>
        <span>Happy New Year</span>
    </footer>

    <script>
        (function () {
            const greetings = [
                "新年新气象，万事皆如意。",
                "愿新的一年，所求皆所愿，所行化坦途。",
                "岁岁常欢愉，年年皆胜意。",
                "愿你新年快乐，阖家幸福，万事顺遂。",
                "新年到，福气到，愿你好运连连。",
                "新的一年，愿你心中有爱，眼中有光。",
                "新年伊始，喜乐无限。",
                "愿新年胜旧年，欢愉且胜意。",
                "愿一切美好，如期而至。",
                "新年快乐，未来可期。"
            ];

            const STAR_COUNT = 60;
            const CONFETTI_COUNT = 34;
            const BALLOON_COUNT = 10;

            function createStars() {
                const c = document.getElementById('stars');
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < STAR_COUNT; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    const size = Math.random() * 1.6 + 0.8;
                    s.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        left: ${Math.random() * 100}%;
                        top: ${Math.random() * 100}%;
                        animation-delay: ${Math.random() * 3.4}s;
                    `;
                    fragment.appendChild(s);
                }
                c.appendChild(fragment);
            }

            function updateCountdown() {
                const now = new Date();
                let nextYear = now.getFullYear();
                if (now.getMonth() === 11 && now.getDate() === 31) {
                    nextYear = now.getFullYear() + 1;
                }
                let target = new Date(nextYear, 0, 1, 0, 0, 0);
                if (now >= target) {
                    target = new Date(nextYear + 1, 0, 1, 0, 0, 0);
                }
                const diff = target - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML =
                    `<div class="countdown-item"><div class="number">${days}</div><div class="label">天</div></div>` +
                    `<div class="countdown-item"><div class="number">${hours}</div><div class="label">时</div></div>` +
                    `<div class="countdown-item"><div class="number">${mins}</div><div class="label">分</div></div>` +
                    `<div class="countdown-item"><div class="number">${secs}</div><div class="label">秒</div></div>`;
                document.getElementById('yearDisplay').textContent = target.getFullYear();
                document.title = `新年倒计时 · 还有${days}天`;
            }

            function updateGreeting() {
                const el = document.getElementById('greeting');
                el.style.opacity = '0';
                setTimeout(() => {
                    el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                    el.style.opacity = '1';
                }, 300);
            }

            function celebrate() {
                createConfetti();
                createBalloons();
            }

            function createConfetti() {
                const colors = ['#efe5d3', '#c05a44', '#9e3f2c', '#d9a073', '#87796a', '#f7efe0'];
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < CONFETTI_COUNT; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    const size = Math.random() * 7 + 6;
                    confetti.style.cssText = `
                        left: ${Math.random() * 100}%;
                        background-color: ${colors[Math.floor(Math.random() * colors.length)]};
                        animation-duration: ${Math.random() * 2 + 2.4}s;
                        height: ${size}px;
                        opacity: ${Math.random() * 0.5 + 0.5};
                    `;
                    fragment.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }
                document.body.appendChild(fragment);
            }

            function createBalloons() {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < BALLOON_COUNT; i++) {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.style.cssText = `
                        left: ${Math.random() * 100}%;
                        animation-duration: ${Math.random() * 2.5 + 4}s;
                        animation-delay: ${Math.random() * 0.6}s;
                    `;
                    fragment.appendChild(balloon);
                    setTimeout(() => balloon.remove(), 7000);
                }
                document.body.appendChild(fragment);
            }

            document.getElementById('celebrateBtn').addEventListener('click', celebrate);

            createStars();
            updateCountdown();
            updateGreeting();
            setInterval(updateCountdown, 1000);
            setInterval(updateGreeting, 5000);
            setTimeout(celebrate, 1200);
        })();
    </script>
</body>
</html>
