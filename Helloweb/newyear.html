<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新年快乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #1a0000;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
        }
        .lantern {
            font-size: 4rem;
            animation: swing 2s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        h1 {
            font-size: 4rem;
            color: #ff4444;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff0000;
            margin: 20px 0;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 20px #ff6600, 0 0 40px #ff0000; }
            to { text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff4400, 0 0 80px #ff0000; }
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .countdown-item {
            background: linear-gradient(135deg, #8b0000, #cc0000);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 80px;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }
        .countdown-item .number {
            font-size: 2.5rem;
            color: #ffdd00;
            font-weight: bold;
        }
        .countdown-item .label {
            font-size: 0.9rem;
            color: #ffcccc;
            margin-top: 5px;
        }
        .greeting {
            color: #ffddaa;
            font-size: 1.3rem;
            margin: 20px 0;
            min-height: 60px;
            line-height: 1.8;
            padding: 0 20px;
            transition: opacity 0.5s;
        }
        .zodiac {
            color: #ffaa66;
            font-size: 1.5rem;
            margin: 10px 0;
        }
        .firework-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .firework-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #cc0000, #ff4444);
            color: #ffdd00;
            border: 2px solid #ffaa00;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }
        .firework-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }
        .baozhu {
            position: fixed;
            bottom: 0;
            font-size: 2rem;
            animation: rise 3s linear forwards;
            z-index: 50;
        }
        @keyframes rise {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .lantern { font-size: 3rem; }
            .countdown-item .number { font-size: 1.8rem; }
            .countdown-item { padding: 10px 15px; min-width: 65px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <canvas class="firework-canvas" id="fireworkCanvas"></canvas>

    <div class="container">
        <div class="lantern">🏮</div>
        <h1>新年快乐</h1>
        <div class="zodiac" id="zodiac"></div>
        <div class="countdown" id="countdown"></div>
        <div class="greeting" id="greeting"></div>
        <button class="firework-btn" onclick="launchFireworks()">🎆 放烟花</button>
    </div>

    <script>
        // 非新年期间跳转到首页 (12月25日 - 1月10日之外)
        (function() {
            var now = new Date();
            var m = now.getMonth() + 1;
            var d = now.getDate();
            if (!((m === 12 && d >= 25) || (m === 1 && d <= 10))) {
                window.location.href = 'index.html';
                return;
            }
        })();

        var greetings = [
            "新年新气象，万事皆如意！",
            "愿新的一年，所求皆所愿，所行化坦途！",
            "爆竹声中一岁除，春风送暖入屠苏！",
            "岁岁常欢愉，年年皆胜意！",
            "愿你新年快乐，阖家幸福，万事顺遂！",
            "新年到，福气到，愿你好运连连！",
            "新年伊始，喜乐无限！",
            "愿新年胜旧年，欢愉且胜意！",
            "新的一年，愿你心中有爱，眼中有光！",
            "金蛇迎春，福满人间！"
        ];

        function createStars() {
            var c = document.getElementById('stars');
            for (var i = 0; i < 100; i++) {
                var s = document.createElement('div');
                s.className = 'star';
                var size = Math.random() * 3 + 1;
                s.style.width = size + 'px';
                s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 2 + 's';
                c.appendChild(s);
            }
        }

        function getZodiac(year) {
            var a = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
            return a[(year - 4) % 12];
        }

        function updateCountdown() {
            var now = new Date();
            var target = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0);
            if (now.getMonth() === 0 && now.getDate() <= 1) {
                target = new Date(now.getFullYear(), 0, 1, 0, 0, 0);
            }
            var diff = target - now;
            var days = Math.floor(diff / (1000 * 60 * 60 * 24));
            var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            var secs = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('countdown').innerHTML =
                '<div class="countdown-item"><div class="number">' + days + '</div><div class="label">天</div></div>' +
                '<div class="countdown-item"><div class="number">' + hours + '</div><div class="label">时</div></div>' +
                '<div class="countdown-item"><div class="number">' + mins + '</div><div class="label">分</div></div>' +
                '<div class="countdown-item"><div class="number">' + secs + '</div><div class="label">秒</div></div>';
            document.getElementById('zodiac').textContent = target.getFullYear() + '年 ' + getZodiac(target.getFullYear()) + '年';
            document.title = '新年倒计时 - 还有' + days + '天';
        }

        function updateGreeting() {
            var el = document.getElementById('greeting');
            el.style.opacity = '0';
            setTimeout(function() {
                el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                el.style.opacity = '1';
            }, 300);
        }

        // 烟花
        var canvas = document.getElementById('fireworkCanvas');
        var ctx = canvas.getContext('2d');
        var particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function Particle(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.alpha = 1;
            this.size = Math.random() * 3 + 1;
        }
        Particle.prototype.update = function() {
            this.x += this.vx; this.y += this.vy;
            this.vy += 0.05; this.alpha -= 0.015;
        };
        Particle.prototype.draw = function() {
            ctx.save(); ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill(); ctx.restore();
        };

        function createFirework(x, y) {
            var colors = ['#ff0000','#ffaa00','#ffff00','#ff6600','#ff44ff','#00ffaa','#ffffff'];
            var color = colors[Math.floor(Math.random() * colors.length)];
            for (var i = 0; i < 80; i++) particles.push(new Particle(x, y, color));
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(function(p) { return p.alpha > 0; });
            particles.forEach(function(p) { p.update(); p.draw(); });
            requestAnimationFrame(animateFireworks);
        }

        function launchFireworks() {
            for (var i = 0; i < 5; i++) {
                (function(i) {
                    setTimeout(function() {
                        createFirework(
                            Math.random() * canvas.width * 0.6 + canvas.width * 0.2,
                            Math.random() * canvas.height * 0.5 + canvas.height * 0.1
                        );
                    }, i * 300);
                })(i);
            }
        }

        function launchBaozhu() {
            var b = document.createElement('div');
            b.className = 'baozhu';
            b.textContent = Math.random() > 0.5 ? '🧨' : '🎇';
            b.style.left = Math.random() * 100 + '%';
            b.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(b);
            setTimeout(function() { b.remove(); }, 4000);
        }

        createStars();
        updateCountdown();
        updateGreeting();
        animateFireworks();
        setInterval(updateCountdown, 1000);
        setInterval(updateGreeting, 5000);
        setInterval(launchBaozhu, 2000);
        setTimeout(launchFireworks, 1000);
    </script>
</body>
</html>
