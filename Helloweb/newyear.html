<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新年快乐</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #1a0000;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            contain: layout paint;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            will-change: opacity;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
            contain: layout style;
        }

        .lantern {
            font-size: 4rem;
            animation: swing 2s ease-in-out infinite;
            display: inline-block;
            will-change: transform;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        h1 {
            font-size: 4rem;
            color: #ff4444;
            text-shadow: 0 0 20px #ff6600, 0 0 40px #ff0000;
            margin: 20px 0;
            animation: glow 2s ease-in-out infinite alternate;
            will-change: text-shadow;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #ff6600, 0 0 40px #ff0000; }
            to { text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff4400, 0 0 80px #ff0000; }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: linear-gradient(135deg, #8b0000, #cc0000);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 80px;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
            contain: layout style;
        }

        .countdown-item .number {
            font-size: 2.5rem;
            color: #ffdd00;
            font-weight: bold;
        }

        .countdown-item .label {
            font-size: 0.9rem;
            color: #ffcccc;
            margin-top: 5px;
        }

        .greeting {
            color: #ffddaa;
            font-size: 1.3rem;
            margin: 20px 0;
            min-height: 60px;
            line-height: 1.8;
            padding: 0 20px;
            transition: opacity 0.5s;
        }

        .zodiac {
            color: #ffaa66;
            font-size: 1.5rem;
            margin: 10px 0;
        }

        .firework-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .firework-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #cc0000, #ff4444);
            color: #ffdd00;
            border: 2px solid #ffaa00;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
            will-change: transform;
        }

        .firework-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .firework-btn:active {
            transform: scale(0.98);
        }

        .baozhu {
            position: fixed;
            bottom: 0;
            font-size: 2rem;
            animation: rise 3s linear forwards;
            z-index: 50;
            will-change: transform, opacity;
            contain: layout style;
        }

        @keyframes rise {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate3d(0, -100vh, 0) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .lantern { font-size: 3rem; }
            .countdown-item .number { font-size: 1.8rem; }
            .countdown-item { padding: 10px 15px; min-width: 65px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <canvas class="firework-canvas" id="fireworkCanvas"></canvas>

    <div class="container">
        <div class="lantern">🏮</div>
        <h1>新年快乐</h1>
        <div class="zodiac" id="zodiac"></div>
        <div class="countdown" id="countdown"></div>
        <div class="greeting" id="greeting"></div>
        <button class="firework-btn" id="fireworkBtn">🧨 庆祝新年</button>
    </div>

    <script src="lunar.js"></script>
    <script>
        (function() {
            const greetings = [
                "新年新气象，万事皆如意！",
                "愿新的一年，所求皆所愿，所行化坦途！",
                "爆竹声中一岁除，春风送暖入屠苏！",
                "岁岁常欢愉，年年皆胜意！",
                "愿你新年快乐，阖家幸福，万事顺遂！",
                "新年到，福气到，愿你好运连连！",
                "新年伊始，喜乐无限！",
                "愿新年胜旧年，欢愉且胜意！",
                "新的一年，愿你心中有爱，眼中有光！",
                "金蛇迎春，福满人间！"
            ];

            const STAR_COUNT = 50;
            const MAX_PARTICLES = 500;
            const FIREWORK_COUNT = 5;
            const BAOZHU_INTERVAL = 3000;

            function createStars() {
                const c = document.getElementById('stars');
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < STAR_COUNT; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    const size = Math.random() * 2 + 1;
                    s.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        left: ${Math.random() * 100}%;
                        top: ${Math.random() * 100}%;
                        animation-delay: ${Math.random() * 2}s;
                    `;
                    fragment.appendChild(s);
                }
                c.appendChild(fragment);
            }

            function getZodiac(year) {
                const a = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
                return a[(year - 4) % 12];
            }

            function updateCountdown() {
                const target = LunarNewYear.getNearestNewYear();
                const now = new Date();
                const diff = target - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML =
                    `<div class="countdown-item"><div class="number">${days}</div><div class="label">天</div></div>` +
                    `<div class="countdown-item"><div class="number">${hours}</div><div class="label">时</div></div>` +
                    `<div class="countdown-item"><div class="number">${mins}</div><div class="label">分</div></div>` +
                    `<div class="countdown-item"><div class="number">${secs}</div><div class="label">秒</div></div>`;
                document.getElementById('zodiac').textContent = `${target.getFullYear()}年 ${getZodiac(target.getFullYear())}年`;
                document.title = `新年倒计时 - 还有${days}天`;
            }

            function updateGreeting() {
                const el = document.getElementById('greeting');
                el.style.opacity = '0';
                setTimeout(() => {
                    el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                    el.style.opacity = '1';
                }, 300);
            }

            // 烟花 Canvas 优化
            const canvas = document.getElementById('fireworkCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let isAnimating = true;

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // 页面可见性优化 - 标签页隐藏时暂停动画
            document.addEventListener('visibilitychange', () => {
                isAnimating = !document.hidden;
                if (isAnimating) {
                    requestAnimationFrame(animateFireworks);
                }
            });

            function Particle(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.size = Math.random() * 2 + 1;
            }

            Particle.prototype.update = function() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.alpha -= 0.012;
            };

            Particle.prototype.draw = function() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            function createFirework(x, y) {
                if (particles.length >= MAX_PARTICLES) return;
                const colors = ['#ff0000','#ffaa00','#ffff00','#ff6600','#ff44ff','#00ffaa','#ffffff'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = Math.min(80, MAX_PARTICLES - particles.length);
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            function animateFireworks() {
                if (!isAnimating) return;

                const w = window.innerWidth;
                const h = window.innerHeight;
                ctx.clearRect(0, 0, w, h);

                // 只保留 alpha > 0 的粒子
                particles = particles.filter(p => p.alpha > 0);

                for (const p of particles) {
                    p.update();
                    p.draw();
                }

                requestAnimationFrame(animateFireworks);
            }

            function launchFireworks() {
                for (let i = 0; i < FIREWORK_COUNT; i++) {
                    setTimeout(() => {
                        createFirework(
                            Math.random() * window.innerWidth * 0.6 + window.innerWidth * 0.2,
                            Math.random() * window.innerHeight * 0.5 + window.innerHeight * 0.1
                        );
                    }, i * 300);
                }
            }

            function launchBaozhu() {
                const b = document.createElement('div');
                b.className = 'baozhu';
                b.textContent = Math.random() > 0.5 ? '🧨' : '🎇';
                b.style.left = `${Math.random() * 100}%`;
                b.style.animationDuration = `${Math.random() * 2 + 2}s`;
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 4000);
            }

            // 爆竹音效优化
            let audioCtx = null;

            function playFirecrackerSound() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    for (let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            const oscillator = audioCtx.createOscillator();
                            const gainNode = audioCtx.createGain();
                            oscillator.connect(gainNode);
                            gainNode.connect(audioCtx.destination);
                            oscillator.type = 'square';
                            oscillator.frequency.setValueAtTime(200 + Math.random() * 800, audioCtx.currentTime);
                            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                            oscillator.start(audioCtx.currentTime);
                            oscillator.stop(audioCtx.currentTime + 0.1);
                        }, i * 100);
                    }
                } catch(e) {
                    console.log('音频播放失败');
                }
            }

            function celebrate() {
                launchFireworks();
                playFirecrackerSound();
            }

            document.getElementById('fireworkBtn').addEventListener('click', celebrate);

            createStars();
            updateCountdown();
            updateGreeting();
            animateFireworks();
            setInterval(updateCountdown, 1000);
            setInterval(updateGreeting, 5000);
            setInterval(launchBaozhu, BAOZHU_INTERVAL);
            setTimeout(celebrate, 1000);
        })();
    </script>
</body>
</html>
