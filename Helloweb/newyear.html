<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140a09">
    <title>新年快乐 · Spring Festival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #140a09;
            --bg-deep: #090404;
            --ink: #f3e9db;
            --ink-soft: #c8b3a2;
            --ink-mute: #8d776a;
            --gold: #c9a05a;
            --gold-soft: #e2c48a;
            --crimson: #a52f27;
            --line: rgba(243, 233, 219, 0.15);
            --line-soft: rgba(243, 233, 219, 0.07);
            --frame: rgba(201, 160, 90, 0.26);
            --font-serif: "Cormorant Garamond", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", serif;
            --font-sans: "Jost", "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            color-scheme: dark;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(3.5rem, 9vh, 6rem) clamp(1.3rem, 6vw, 4rem);
            overflow-x: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -2;
            background:
                radial-gradient(46% 40% at 50% 112%, rgba(165, 47, 39, 0.32), transparent 70%),
                radial-gradient(34% 30% at 86% 6%, rgba(201, 160, 90, 0.16), transparent 70%),
                linear-gradient(178deg, var(--bg) 0%, var(--bg-deep) 100%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.07;
            mix-blend-mode: screen;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>");
        }

        .frame {
            position: fixed;
            inset: 18px;
            z-index: 2;
            border: 1px solid var(--frame);
            pointer-events: none;
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            border: 1px solid var(--gold);
            opacity: 0.6;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: 0;
            border-bottom: 0;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: 0;
            border-top: 0;
        }

        .halo {
            position: fixed;
            right: -16vw;
            top: -22vh;
            width: min(70vmin, 600px);
            aspect-ratio: 1;
            z-index: -1;
            border: 1px solid rgba(201, 160, 90, 0.22);
            border-radius: 50%;
            pointer-events: none;
        }

        .halo::after {
            content: "";
            position: absolute;
            inset: 14%;
            border: 1px solid var(--line-soft);
            border-radius: 50%;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            contain: layout paint;
        }

        .star {
            position: absolute;
            background: rgba(243, 233, 219, 0.7);
            border-radius: 50%;
            will-change: opacity;
            animation: twinkle 3.2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.15; }
            to { opacity: 0.8; }
        }

        .firework-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .stage {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 820px;
            text-align: center;
        }

        /* CSS 灯笼 */
        .lantern {
            position: relative;
            width: 74px;
            height: 98px;
            margin: 0 auto clamp(2rem, 5vh, 2.8rem);
            border: 1px solid rgba(201, 160, 90, 0.6);
            border-radius: 50% 50% 46% 46% / 40% 40% 60% 60%;
            background:
                repeating-linear-gradient(90deg, transparent 0 12px, rgba(201, 160, 90, 0.16) 12px 13px),
                radial-gradient(circle at 50% 36%, rgba(181, 58, 47, 0.5), rgba(74, 16, 14, 0.12) 68%);
            box-shadow: inset 0 0 32px rgba(181, 58, 47, 0.35), 0 20px 60px rgba(165, 47, 39, 0.22);
            transform-origin: 50% -24px;
            animation: swing 4.6s ease-in-out infinite, fadeIn 1.2s var(--ease) backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lantern::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -24px;
            width: 1px;
            height: 24px;
            background: var(--gold);
            opacity: 0.7;
        }

        .lantern::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -30px;
            width: 1px;
            height: 30px;
            background: linear-gradient(var(--gold), transparent);
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.9rem;
            font-size: 0.6rem;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: var(--ink-mute);
            animation: rise 1s var(--ease) 0.18s backwards;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";
            width: 30px;
            height: 1px;
            background: var(--gold);
            opacity: 0.8;
        }

        h1 {
            margin-top: 1.4rem;
            font-family: var(--font-serif);
            font-weight: 300;
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 1.08;
            letter-spacing: 0.26em;
            color: var(--ink);
            text-shadow: 0 0 60px rgba(181, 58, 47, 0.35);
            animation: rise 1.1s var(--ease) 0.3s backwards;
        }

        .zodiac {
            margin-top: 1rem;
            font-family: var(--font-serif);
            font-size: 0.92rem;
            letter-spacing: 0.4em;
            color: var(--gold);
            animation: rise 1s var(--ease) 0.42s backwards;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin: clamp(2.2rem, 6vh, 3.2rem) auto 0;
            max-width: 580px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            animation: rise 1.1s var(--ease) 0.54s backwards;
        }

        .countdown-item {
            position: relative;
            padding: 1.4rem 0.4rem 1.25rem;
            contain: layout style;
        }

        .countdown-item + .countdown-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 1.4rem;
            bottom: 1.25rem;
            width: 1px;
            background: var(--line-soft);
        }

        .countdown-item .number {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2rem, 4.8vw, 3rem);
            line-height: 1;
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
            color: var(--gold-soft);
        }

        .countdown-item .label {
            margin-top: 0.65rem;
            font-size: 0.56rem;
            letter-spacing: 0.28em;
            color: var(--ink-mute);
        }

        .greeting {
            max-width: 34rem;
            margin: clamp(1.7rem, 4vh, 2.4rem) auto 0;
            min-height: 3.6rem;
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.1em;
            color: var(--ink-soft);
            padding: 0 1rem;
            transition: opacity 0.5s var(--ease);
            animation: rise 1s var(--ease) 0.64s backwards;
        }

        .firework-btn {
            margin-top: clamp(1.4rem, 4vh, 2.2rem);
            appearance: none;
            border: 1px solid var(--frame);
            background: transparent;
            color: var(--gold-soft);
            font-family: var(--font-sans);
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            padding: 0.95rem 2.1rem 0.9rem;
            border-radius: 999px;
            cursor: pointer;
            transition: color 0.4s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease), box-shadow 0.4s var(--ease);
            animation: rise 1s var(--ease) 0.74s backwards;
        }

        .firework-btn:hover {
            color: #17100b;
            background: linear-gradient(135deg, var(--gold-soft), var(--gold));
            border-color: var(--gold);
            box-shadow: 0 12px 44px rgba(201, 160, 90, 0.2);
        }

        .firework-btn:active {
            transform: translateY(1px);
        }

        .firework-btn:focus-visible {
            outline: 1px solid var(--gold);
            outline-offset: 4px;
        }

        .page-foot {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 820px;
            margin-top: clamp(2.4rem, 6vh, 3.4rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.56rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--ink-mute);
            animation: rise 1s var(--ease) 0.84s backwards;
        }

        /* 升起的金色火星 */
        .baozhu {
            position: fixed;
            bottom: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold-soft);
            box-shadow: 0 0 12px rgba(226, 196, 138, 0.9), 0 0 26px rgba(201, 160, 90, 0.4);
            animation: sparkRise 4s linear forwards;
            z-index: 90;
            will-change: transform, opacity;
            contain: layout style;
        }

        @keyframes sparkRise {
            0% { transform: translate3d(0, 6vh, 0); opacity: 0.9; }
            85% { opacity: 0.7; }
            100% { transform: translate3d(0, -104vh, 0); opacity: 0; }
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .frame { inset: 10px; }

            .halo { right: -34vw; top: -12vh; width: 78vmin; }

            .lantern { width: 62px; height: 82px; }

            h1 { letter-spacing: 0.18em; }

            .countdown-item { padding: 1.1rem 0.3rem 0.95rem; }

            .countdown-item + .countdown-item::before {
                top: 1.1rem;
                bottom: 0.95rem;
            }

            .page-foot {
                align-items: center;
                flex-direction: column;
                gap: 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="frame" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <canvas class="firework-canvas" id="fireworkCanvas" aria-hidden="true"></canvas>

    <main class="stage">
        <div class="lantern" aria-hidden="true"></div>
        <p class="eyebrow">Spring Festival · 春节</p>
        <h1>新年快乐</h1>
        <div class="zodiac" id="zodiac"></div>
        <div class="countdown" id="countdown" aria-label="春节倒计时"></div>
        <div class="greeting" id="greeting" aria-live="polite"></div>
        <button class="firework-btn" id="fireworkBtn" type="button">Fireworks · 点起烟花</button>
    </main>

    <footer class="page-foot" aria-hidden="true">
        <span>爆竹声中一岁除</span>
        <span>Happy Spring Festival</span>
    </footer>

    <script src="lunar.js"></script>
    <script>
        (function () {
            const greetings = [
                "新年新气象，万事皆如意。",
                "愿新的一年，所求皆所愿，所行化坦途。",
                "爆竹声中一岁除，春风送暖入屠苏。",
                "岁岁常欢愉，年年皆胜意。",
                "愿你新年快乐，阖家幸福，万事顺遂。",
                "新年到，福气到，愿你好运连连。",
                "新年伊始，喜乐无限。",
                "愿新年胜旧年，欢愉且胜意。",
                "新的一年，愿你心中有爱，眼中有光。",
                "灯火可亲，万家团圆。"
            ];

            const STAR_COUNT = 60;
            const MAX_PARTICLES = 480;
            const FIREWORK_COUNT = 5;
            const BAOZHU_INTERVAL = 3200;

            function createStars() {
                const c = document.getElementById('stars');
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < STAR_COUNT; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    const size = Math.random() * 1.6 + 0.8;
                    s.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        left: ${Math.random() * 100}%;
                        top: ${Math.random() * 100}%;
                        animation-delay: ${Math.random() * 3.2}s;
                    `;
                    fragment.appendChild(s);
                }
                c.appendChild(fragment);
            }

            function getZodiac(year) {
                const a = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
                return a[(year - 4) % 12];
            }

            function updateCountdown() {
                const target = LunarNewYear.getNearestNewYear();
                const now = new Date();
                const diff = target - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML =
                    `<div class="countdown-item"><div class="number">${days}</div><div class="label">天 DAYS</div></div>` +
                    `<div class="countdown-item"><div class="number">${hours}</div><div class="label">时 HOURS</div></div>` +
                    `<div class="countdown-item"><div class="number">${mins}</div><div class="label">分 MINUTES</div></div>` +
                    `<div class="countdown-item"><div class="number">${secs}</div><div class="label">秒 SECONDS</div></div>`;
                document.getElementById('zodiac').textContent = `${target.getFullYear()} · ${getZodiac(target.getFullYear())}年`;
                document.title = `春节倒计时 · 还有${days}天`;
            }

            function updateGreeting() {
                const el = document.getElementById('greeting');
                el.style.opacity = '0';
                setTimeout(() => {
                    el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                    el.style.opacity = '1';
                }, 300);
            }

            // 烟花 Canvas
            const canvas = document.getElementById('fireworkCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let isAnimating = true;

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            document.addEventListener('visibilitychange', () => {
                isAnimating = !document.hidden;
                if (isAnimating) {
                    requestAnimationFrame(animateFireworks);
                }
            });

            function Particle(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 7;
                this.vy = (Math.random() - 0.5) * 7;
                this.alpha = 1;
                this.size = Math.random() * 1.6 + 0.6;
            }

            Particle.prototype.update = function () {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.045;
                this.alpha -= 0.014;
            };

            Particle.prototype.draw = function () {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            function createFirework(x, y) {
                if (particles.length >= MAX_PARTICLES) return;
                const colors = ['#c9a05a', '#e2c48a', '#f3e9db', '#b53a2f', '#d8a15c', '#e8b04b'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = Math.min(80, MAX_PARTICLES - particles.length);
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            function animateFireworks() {
                if (!isAnimating) return;

                const w = window.innerWidth;
                const h = window.innerHeight;
                ctx.clearRect(0, 0, w, h);

                particles = particles.filter(p => p.alpha > 0);

                for (const p of particles) {
                    p.update();
                    p.draw();
                }

                requestAnimationFrame(animateFireworks);
            }

            function launchFireworks() {
                for (let i = 0; i < FIREWORK_COUNT; i++) {
                    setTimeout(() => {
                        createFirework(
                            Math.random() * window.innerWidth * 0.6 + window.innerWidth * 0.2,
                            Math.random() * window.innerHeight * 0.5 + window.innerHeight * 0.1
                        );
                    }, i * 320);
                }
            }

            function launchBaozhu() {
                const b = document.createElement('div');
                b.className = 'baozhu';
                b.style.left = `${Math.random() * 100}%`;
                b.style.animationDuration = `${Math.random() * 2 + 2.4}s`;
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 5000);
            }

            // 爆竹音效
            let audioCtx = null;

            function playFirecrackerSound() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    for (let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            const oscillator = audioCtx.createOscillator();
                            const gainNode = audioCtx.createGain();
                            oscillator.connect(gainNode);
                            gainNode.connect(audioCtx.destination);
                            oscillator.type = 'square';
                            oscillator.frequency.setValueAtTime(200 + Math.random() * 800, audioCtx.currentTime);
                            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                            oscillator.start(audioCtx.currentTime);
                            oscillator.stop(audioCtx.currentTime + 0.1);
                        }, i * 100);
                    }
                } catch (e) {
                    console.log('音频播放失败');
                }
            }

            function celebrate() {
                launchFireworks();
                playFirecrackerSound();
            }

            document.getElementById('fireworkBtn').addEventListener('click', celebrate);

            createStars();
            updateCountdown();
            updateGreeting();
            animateFireworks();
            setInterval(updateCountdown, 1000);
            setInterval(updateGreeting, 5000);
            setInterval(launchBaozhu, BAOZHU_INTERVAL);
            setTimeout(celebrate, 1400);
        })();
    </script>
</body>
</html>
