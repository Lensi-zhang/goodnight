<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#170907">
    <title>新年快乐 · Spring Festival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #170907;
            --paper-2: #0b0403;
            --ink: #f3e8d6;
            --ink-soft: #c7b09f;
            --ink-mute: #967e70;
            --vermilion: #cf5a41;
            --vermilion-deep: #a33a29;
            --line: rgba(243, 232, 214, 0.16);
            --line-soft: rgba(243, 232, 214, 0.07);
            --frame: rgba(207, 90, 65, 0.3);
            --wash: rgba(207, 90, 65, 0.12);
            --font-serif: "Cormorant Garamond", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", serif;
            --font-sans: "Jost", "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            color-scheme: dark;
        }

        ::selection {
            background: var(--vermilion);
            color: var(--paper);
        }

        /* 返回入口 */
        .home-link {
            position: fixed;
            top: clamp(1.5rem, 3.2vh, 2.3rem);
            left: clamp(1.6rem, 4vw, 3rem);
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.62rem;
            letter-spacing: 0.3em;
            color: var(--ink-mute);
            text-decoration: none;
            transition: color 0.35s var(--ease);
        }

        .home-link .mark {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            border: 1px solid var(--line);
            color: var(--vermilion);
            font-size: 0.72rem;
            letter-spacing: 0;
            transition: border-color 0.35s var(--ease), transform 0.35s var(--ease);
        }

        .home-link:hover {
            color: var(--ink);
        }

        .home-link:hover .mark {
            border-color: var(--vermilion);
            transform: rotate(-6deg);
        }

        .home-link:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 4px;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(3.4rem, 8vh, 5.5rem) clamp(1.4rem, 6vw, 4.5rem);
            overflow-x: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-feature-settings: "lnum" 1;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -3;
            background:
                radial-gradient(48% 40% at 50% 112%, rgba(207, 90, 65, 0.36), transparent 70%),
                radial-gradient(36% 32% at 86% 4%, var(--wash), transparent 70%),
                linear-gradient(178deg, var(--paper) 0%, var(--paper-2) 100%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.075;
            mix-blend-mode: screen;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' stitchTiles='stitch'/></filter><rect width='150' height='150' filter='url(%23n)' opacity='0.6'/></svg>");
        }

        .ink-wash {
            position: fixed;
            left: -16vw;
            bottom: -20vh;
            width: 66vmin;
            height: 52vmin;
            z-index: -2;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 50%, rgba(207, 90, 65, 0.22), rgba(207, 90, 65, 0.06) 55%, transparent 74%);
            filter: blur(26px);
            pointer-events: none;
        }

        .frame {
            position: fixed;
            inset: 18px;
            z-index: 2;
            border: 1px solid var(--frame);
            pointer-events: none;
        }

        .frame::before,
        .frame::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            border: 1px solid var(--vermilion);
            opacity: 0.75;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: 0;
            border-bottom: 0;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: 0;
            border-top: 0;
        }

        .side-rail {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            writing-mode: vertical-rl;
            font-family: var(--font-serif);
            font-size: 0.82rem;
            letter-spacing: 0.55em;
            color: var(--ink-mute);
            opacity: 0.72;
            pointer-events: none;
        }

        .side-rail::before {
            content: "";
            display: block;
            width: 1px;
            height: 34px;
            margin: 0 auto 0.9rem;
            background: var(--line);
        }

        .ghost-seal {
            position: fixed;
            left: -4vw;
            bottom: -7vh;
            width: 34vmin;
            aspect-ratio: 1;
            z-index: -1;
            display: grid;
            place-items: center;
            font-family: var(--font-serif);
            font-size: 10vmin;
            color: rgba(207, 90, 65, 0.12);
            transform: rotate(-5deg);
            pointer-events: none;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            contain: layout paint;
        }

        .star {
            position: absolute;
            background: rgba(243, 232, 214, 0.65);
            border-radius: 50%;
            will-change: opacity;
            animation: twinkle 3.4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.12; }
            to { opacity: 0.7; }
        }

        .firework-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .stage {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .seal {
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            background: linear-gradient(160deg, var(--vermilion), var(--vermilion-deep));
            color: #f7efe0;
            font-family: var(--font-serif);
            font-size: 1rem;
            line-height: 1;
            box-shadow: inset 0 0 0 2px rgba(247, 239, 224, 0.34), 0 4px 18px rgba(163, 58, 41, 0.4);
        }

        .stage-seal {
            position: absolute;
            top: 0;
            right: 0;
            transform: rotate(5deg);
            animation: inkIn 1.1s var(--ease) 0.1s backwards;
        }

        /* CSS 灯笼 */
        .lantern {
            position: relative;
            width: clamp(62px, 5.6vw, 86px);
            aspect-ratio: 3 / 4;
            margin: 0 auto clamp(1.8rem, 4.5vh, 2.5rem);
            border: 1px solid rgba(207, 90, 65, 0.75);
            border-radius: 50% 50% 46% 46% / 40% 40% 60% 60%;
            background:
                repeating-linear-gradient(90deg, transparent 0 12px, rgba(243, 232, 214, 0.24) 12px 13px),
                radial-gradient(circle at 50% 36%, rgba(207, 90, 65, 0.55), rgba(74, 16, 14, 0.16) 68%);
            box-shadow: inset 0 0 30px rgba(207, 90, 65, 0.4), 0 20px 60px rgba(163, 58, 41, 0.25);
            transform-origin: 50% -24px;
            animation: swing 4.8s ease-in-out infinite, fadeIn 1.2s var(--ease) backwards;
        }

        .lantern-cap {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 3px;
            background: rgba(243, 232, 214, 0.45);
            border: 1px solid rgba(207, 90, 65, 0.65);
        }

        .lantern-cap.top { top: -3px; }
        .lantern-cap.bottom { bottom: -3px; }

        .lantern::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -24px;
            width: 1px;
            height: 24px;
            background: rgba(243, 232, 214, 0.55);
        }

        .lantern::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -30px;
            width: 1px;
            height: 30px;
            background: linear-gradient(rgba(243, 232, 214, 0.6), transparent);
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            font-family: var(--font-serif);
            font-size: 0.74rem;
            letter-spacing: 0.45em;
            color: var(--ink-soft);
            animation: inkIn 1s var(--ease) 0.2s backwards;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";
            width: 6px;
            height: 6px;
            background: var(--vermilion);
        }

        h1 {
            margin-top: 1.4rem;
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2.9rem, 7.6vw, 4.7rem);
            line-height: 1.12;
            letter-spacing: 0.28em;
            color: var(--ink);
            text-shadow: 0 0 70px rgba(207, 90, 65, 0.4);
            animation: inkIn 1.2s var(--ease) 0.32s backwards;
        }

        .zodiac {
            margin-top: 1rem;
            font-family: var(--font-serif);
            font-size: 0.9rem;
            letter-spacing: 0.42em;
            color: var(--vermilion);
            animation: inkIn 1s var(--ease) 0.44s backwards;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin: clamp(2.2rem, 5.5vh, 3.1rem) auto 0;
            max-width: 570px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            animation: inkIn 1.1s var(--ease) 0.56s backwards;
        }

        .countdown-item {
            position: relative;
            padding: 1.35rem 0.4rem 1.2rem;
            contain: layout style;
        }

        .countdown-item + .countdown-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 1.35rem;
            bottom: 1.2rem;
            width: 1px;
            background: var(--line-soft);
        }

        .countdown-item .number {
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(2rem, 4.6vw, 2.9rem);
            line-height: 1;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }

        .countdown-item .label {
            margin-top: 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--vermilion);
        }

        .greeting {
            max-width: 32rem;
            margin: clamp(1.7rem, 4vh, 2.4rem) auto 0;
            min-height: 3.4rem;
            font-family: var(--font-serif);
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 2.05;
            letter-spacing: 0.14em;
            color: var(--ink-soft);
            padding: 0 1rem;
            transition: opacity 0.5s var(--ease);
            animation: inkIn 1s var(--ease) 0.66s backwards;
        }

        .firework-btn {
            margin-top: clamp(1.4rem, 4vh, 2.1rem);
            appearance: none;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink-soft);
            font-family: var(--font-serif);
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.4em;
            padding: 0.95rem 2.2rem 0.9rem 2.5rem;
            cursor: pointer;
            transition: color 0.4s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease);
            animation: inkIn 1s var(--ease) 0.76s backwards;
        }

        .firework-btn:hover {
            color: #f7efe0;
            background: var(--vermilion-deep);
            border-color: var(--vermilion);
        }

        .firework-btn:active {
            transform: translateY(1px);
        }

        .firework-btn:focus-visible {
            outline: 1px solid var(--vermilion);
            outline-offset: 4px;
        }

        .page-foot {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 800px;
            margin-top: clamp(2.2rem, 5.5vh, 3.2rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-family: var(--font-serif);
            font-size: 0.62rem;
            letter-spacing: 0.32em;
            color: var(--ink-mute);
            animation: inkIn 1s var(--ease) 0.86s backwards;
        }

        .page-foot span:last-child {
            font-family: var(--font-sans);
            font-size: 0.54rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* 升起的朱砂火星 */
        .baozhu {
            position: fixed;
            bottom: 0;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--vermilion);
            box-shadow: 0 0 12px rgba(207, 90, 65, 0.9), 0 0 26px rgba(207, 90, 65, 0.45);
            animation: sparkRise 4s linear forwards;
            z-index: 90;
            will-change: transform, opacity;
            contain: layout style;
        }

        @keyframes sparkRise {
            0% { transform: translate3d(0, 6vh, 0); opacity: 0.95; }
            85% { opacity: 0.7; }
            100% { transform: translate3d(0, -104vh, 0); opacity: 0; }
        }

        @keyframes inkIn {
            from {
                opacity: 0;
                filter: blur(7px);
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .side-rail {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .frame { inset: 10px; }

            .ghost-seal {
                display: none;
            }

            .stage-seal {
                position: static;
                display: inline-grid;
                margin-bottom: 1rem;
            }

            .lantern { width: 60px; height: 80px; }

            h1 { letter-spacing: 0.2em; }

            .countdown-item { padding: 1.05rem 0.3rem 0.9rem; }

            .countdown-item + .countdown-item::before {
                top: 1.05rem;
                bottom: 0.9rem;
            }

            .countdown-item .number { font-size: 1.75rem; }

            .page-foot {
                align-items: center;
                flex-direction: column;
                gap: 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <a class="home-link" href="index.html" aria-label="返回晚安首页">
        <span class="mark" aria-hidden="true">归</span>
        <span>晚安</span>
    </a>
    <div class="frame" aria-hidden="true"></div>
    <div class="ink-wash" aria-hidden="true"></div>
    <div class="ghost-seal" aria-hidden="true">春</div>
    <div class="side-rail" aria-hidden="true">春满人间</div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <canvas class="firework-canvas" id="fireworkCanvas" aria-hidden="true"></canvas>

    <main class="stage">
        <span class="seal stage-seal" aria-hidden="true">春</span>
        <div class="lantern" aria-hidden="true">
            <span class="lantern-cap top"></span>
            <span class="lantern-cap bottom"></span>
        </div>
        <p class="eyebrow">春节 · 岁首</p>
        <h1>新年快乐</h1>
        <div class="zodiac" id="zodiac"></div>
        <div class="countdown" id="countdown" aria-label="春节倒计时"></div>
        <div class="greeting" id="greeting" aria-live="polite"></div>
        <button class="firework-btn" id="fireworkBtn" type="button">点起烟花</button>
    </main>

    <footer class="page-foot" aria-hidden="true">
        <span>爆竹声中一岁除</span>
        <span>Happy Spring Festival</span>
    </footer>

    <script src="lunar.js"></script>
    <script>
        (function () {
            const greetings = [
                "新年新气象，万事皆如意。",
                "愿新的一年，所求皆所愿，所行化坦途。",
                "爆竹声中一岁除，春风送暖入屠苏。",
                "岁岁常欢愉，年年皆胜意。",
                "愿你新年快乐，阖家幸福，万事顺遂。",
                "新年到，福气到，愿你好运连连。",
                "新年伊始，喜乐无限。",
                "愿新年胜旧年，欢愉且胜意。",
                "新的一年，愿你心中有爱，眼中有光。",
                "灯火可亲，万家团圆。"
            ];

            const STAR_COUNT = 60;
            const MAX_PARTICLES = 460;
            const FIREWORK_COUNT = 5;
            const BAOZHU_INTERVAL = 3200;

            function createStars() {
                const c = document.getElementById('stars');
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < STAR_COUNT; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    const size = Math.random() * 1.6 + 0.8;
                    s.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        left: ${Math.random() * 100}%;
                        top: ${Math.random() * 100}%;
                        animation-delay: ${Math.random() * 3.4}s;
                    `;
                    fragment.appendChild(s);
                }
                c.appendChild(fragment);
            }

            function getZodiac(year) {
                const a = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
                return a[(year - 4) % 12];
            }

            function updateCountdown() {
                const target = LunarNewYear.getNearestNewYear();
                const now = new Date();
                const diff = target - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML =
                    `<div class="countdown-item"><div class="number">${days}</div><div class="label">天</div></div>` +
                    `<div class="countdown-item"><div class="number">${hours}</div><div class="label">时</div></div>` +
                    `<div class="countdown-item"><div class="number">${mins}</div><div class="label">分</div></div>` +
                    `<div class="countdown-item"><div class="number">${secs}</div><div class="label">秒</div></div>`;
                document.getElementById('zodiac').textContent = `${target.getFullYear()} · ${getZodiac(target.getFullYear())}年`;
                document.title = `春节倒计时 · 还有${days}天`;
            }

            function updateGreeting() {
                const el = document.getElementById('greeting');
                el.style.opacity = '0';
                setTimeout(() => {
                    el.textContent = greetings[Math.floor(Math.random() * greetings.length)];
                    el.style.opacity = '1';
                }, 300);
            }

            // 烟花 Canvas
            const canvas = document.getElementById('fireworkCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let isAnimating = true;

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            document.addEventListener('visibilitychange', () => {
                isAnimating = !document.hidden;
                if (isAnimating) {
                    requestAnimationFrame(animateFireworks);
                }
            });

            function Particle(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 7;
                this.vy = (Math.random() - 0.5) * 7;
                this.alpha = 1;
                this.size = Math.random() * 1.6 + 0.6;
            }

            Particle.prototype.update = function () {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.045;
                this.alpha -= 0.014;
            };

            Particle.prototype.draw = function () {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            function createFirework(x, y) {
                if (particles.length >= MAX_PARTICLES) return;
                const colors = ['#cf5a41', '#f3e8d6', '#e88a63', '#b8432f', '#d9a073', '#f8dfc4'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = Math.min(80, MAX_PARTICLES - particles.length);
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            function animateFireworks() {
                if (!isAnimating) return;

                const w = window.innerWidth;
                const h = window.innerHeight;
                ctx.clearRect(0, 0, w, h);

                particles = particles.filter(p => p.alpha > 0);

                for (const p of particles) {
                    p.update();
                    p.draw();
                }

                requestAnimationFrame(animateFireworks);
            }

            function launchFireworks() {
                for (let i = 0; i < FIREWORK_COUNT; i++) {
                    setTimeout(() => {
                        const x = (Math.random() < 0.5 ? 0.06 + Math.random() * 0.24 : 0.7 + Math.random() * 0.24) * window.innerWidth;
                        const y = (0.12 + Math.random() * 0.3) * window.innerHeight;
                        createFirework(x, y);
                    }, i * 320);
                }
            }

            function launchBaozhu() {
                const b = document.createElement('div');
                b.className = 'baozhu';
                b.style.left = `${Math.random() * 100}%`;
                b.style.animationDuration = `${Math.random() * 2 + 2.4}s`;
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 5000);
            }

            // 爆竹音效
            let audioCtx = null;

            function playFirecrackerSound() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    for (let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            const oscillator = audioCtx.createOscillator();
                            const gainNode = audioCtx.createGain();
                            oscillator.connect(gainNode);
                            gainNode.connect(audioCtx.destination);
                            oscillator.type = 'square';
                            oscillator.frequency.setValueAtTime(200 + Math.random() * 800, audioCtx.currentTime);
                            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                            oscillator.start(audioCtx.currentTime);
                            oscillator.stop(audioCtx.currentTime + 0.1);
                        }, i * 100);
                    }
                } catch (e) {
                    console.log('音频播放失败');
                }
            }

            function celebrate() {
                launchFireworks();
                playFirecrackerSound();
            }

            document.getElementById('fireworkBtn').addEventListener('click', celebrate);

            createStars();
            updateCountdown();
            updateGreeting();
            animateFireworks();
            setInterval(updateCountdown, 1000);
            setInterval(updateGreeting, 5000);
            setInterval(launchBaozhu, BAOZHU_INTERVAL);
            setTimeout(celebrate, 1400);
        })();
    </script>
</body>
</html>
